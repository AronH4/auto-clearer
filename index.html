.ti{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#fff;overflow:hidden}

.tb{display:inline-flex;align-items:center;gap:4px;border-radius:12px;padding:1px 8px 1px 2px;color:#fff;font-weight:bold;text-shadow:0 0 3px #000}

.bf{border:1px solid #2c3350;border-radius:8px;padding:5px;margin-bottom:6px;background:#1a1e2b;opacity:.6}.bf.on{opacity:1;border-color:#6a7bd0}
.th i{font-style:normal;display:inline-block;min-width:16px;text-align:center;border-radius:4px;margin-left:3px;background:#2c3350;color:#889}
.th i.r{background:#44527f;color:#fff}.th i.a{background:#e8b923;color:#000}
.bd{margin-top:3px;color:#cdd}

.chip.on{opacity:1}.chip img{width:30px;height:30px;image-rendering:pixelated}
h4{margin:8px 0 2px;color:#9ab}
#ghost{position:fixed;width:64px;height:64px;pointer-events:none;z-index:99;image-rendering:pixelated;opacity:.85}
#ctrl{display:flex;flex-direction:column;gap:6px;padding:6px 2px}
#stat{display:flex;flex-wrap:wrap;gap:4px 20px;font-size:15px}#plc{cursor:help;border-bottom:1px dotted #889}

/* ================= HEX-GEOMETRIE ================= */

const income=()=>CFG.income+Math.min(CFG.maxInterest,Math.floor(S.gold/10));
const msg=t=>$('msg').textContent=t;
const unitById=id=>S.units.find(u=>u.id==id);
function newGame(){S={round:1,gold:CFG.startGold,lives:CFG.lives,units:[],nextId:1,shop:[],phase:'prep',sel:null,speed:1,pool:{}};
 SP.forEach((s,i)=>S.pool[i]=CFG.copies[s.c]);roll();msg('Viel Erfolg!');render()}
function save(){try{localStorage.setItem('pab4',JSON.stringify(S))}catch(e){}}
function clearSave(){try{localStorage.removeItem('pab4')}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem('pab4'));if(s&&s.pool&&s.units){S=s;S.phase='prep';S.speed=1;return true}}catch(e){}return false}

function roll(){S.shop=[];const tier=CFG.odds.find(o=>S.round<=o[0])[1];
 for(let k=0;k<5;k++){
  const av=SP.map((s,i)=>({i,c:s.c,w:S.pool[i]})).filter(x=>x.w>0&&!S.units.some(u=>u.sp==x.i&&u.star==3));
  const costs=[1,2,3,4,5].filter(c=>av.some(x=>x.c==c)&&tier[c-1]>0);
  if(!costs.length){S.shop.push(null);continue}
  let r=Math.random()*costs.reduce((a,c)=>a+tier[c-1],0),cost=costs[0];
  for(const c of costs){r-=tier[c-1];if(r<=0){cost=c;break}}
  const cand=av.filter(x=>x.c==cost);let w=Math.random()*cand.reduce((a,x)=>a+x.w,0),pick=cand[0].i;
  for(const x of cand){w-=x.w;if(w<=0){pick=x.i;break}}
  S.shop.push(pick)}}
function reroll(){if(S.phase!='prep'||S.gold<CFG.reroll)return;S.gold-=CFG.reroll;roll();render()}
function freeHex(){for(let r=4;r<ROWS;r++)for(let c=0;c<COLS;c++)if(!occAt({r,c}))return{r,c};return null}
/* Verschmelzen: 3 gleiche Einheiten gleicher Stufe -> 1 Einheit der nächsten Stufe (Position: bevorzugt eine aufgestellte) */
function tryMerge(){let out='',again=true;
 while(again){again=false;
  for(let sp=0;sp<SP.length&&!again;sp++)for(let st=1;st<=2&&!again;st++){
   const L=S.units.filter(u=>u.sp==sp&&u.star==st).sort((a,b)=>(b.pos?1:0)-(a.pos?1:0));
   if(L.length>=CFG.mergeNeeded){const t=L.slice(0,CFG.mergeNeeded),pos=t[0].pos;
    S.units=S.units.filter(u=>!t.includes(u));S.units.push({id:S.nextId++,sp,star:st+1,pos});
    out=`✨ ${SP[sp].n[st]} ist jetzt Stufe ${st+1}!`;again=true}}}
 return out}
function buy(k){if(S.phase!='prep')return;const i=S.shop[k];if(i==null)return;const s=SP[i];
 if(S.gold<s.c){msg('Zu wenig Gold!');return}
 if(S.units.some(u=>u.sp==i&&u.star==3))return;
 const wouldMerge=S.units.filter(u=>u.sp==i&&u.star==1).length>=CFG.mergeNeeded-1;
 let autoPos=null;
 if(benchCount()>=CFG.benchMax&&!wouldMerge){
  if(placed().length<limit())autoPos=freeHex();
  if(!autoPos){msg(`Die Bank ist voll (${CFG.benchMax})! Verkaufe oder stelle Pokémon auf.`);return}}
 S.gold-=s.c;S.pool[i]--;S.shop[k]=null;
 S.units.push({id:S.nextId++,sp:i,star:1,pos:autoPos});
 const m=tryMerge();if(m)msg(m);
 render()}
function sell(id){const u=unitById(id);if(!u)return;const n=cardsEq(u),g=SP[u.sp].c*n;
 S.gold+=g;S.pool[u.sp]+=n;S.units=S.units.filter(x=>x!==u);msg(`🗑️ ${SP[u.sp].n[u.star-1]} verkauft: +${g} Gold`)}
function trashClick(){if(S.phase!='prep'||S.sel==null)return;sell(S.sel);S.sel=null;render()}

/* ================= EINHEITEN ================= */
function mk(team,r,c,name,id,sh,st){const[x,y]=px(r,c);
 return{team,r,c,name,id,sh,x,y,lx:0,ly:0,hp:st.hp,max:st.hp,atk:st.atk,aspd:st.aspd,def:st.def,crit:st.crit,range:st.range,
  mana:0,mmax:CFG.base.mana,mg:st.mg,skill:st.skill,cd:Math.random()*.5,mv:0,star:st.star||0,big:!!st.big,
  dm:1,ls:0,shield:0,fight:0,fire:0,fN:0,fT:null,ice:0,fairy:0,bug:0,bugDone:0,ground:0,pois:0,psy:0,dragon:0,rev:0,
  stun:0,slow:0,slowT:0,poisT:0,poisD:0,pAcc:0,atkN:0,spdBuff:0,decoy:false}}
function typeCounts(){const c={},seen=new Set();placed().forEach(u=>{if(seen.has(u.sp))return;seen.add(u.sp);SP[u.sp].t.forEach(t=>c[t]=(c[t]||0)+1)});return c}  // zählt verschiedene Pokémon-Arten
function buildPlayer(bat){const cnt=typeCounts();
 const L=placed().map(o=>{const s=SP[o.sp],st=o.star,b=CFG.base,ov=s.s;
  const u=mk('p',o.pos.r,o.pos.c,s.n[st-1],s.id[st-1],s.sh,{
   hp:(ov.hp||b.hp)*CFG.hpMul[st-1],atk:(ov.atk||b.atk)*CFG.atkMul[st-1],aspd:ov.aspd||b.aspd,def:ov.def||b.def,
   crit:ov.crit??b.crit,range:ov.range||b.range,mg:b.manaGain,skill:(ov.skill||CFG.skillMul[st-1]),star:st});
  u.t=s.t;return u});
 if(bat)for(const u of L)for(const t of u.t){const v=bonusVal(t,cnt[t]);if(!v)continue;
  switch(t){
   case'Steel':u.shield=u.max*v;break;case'Grass':u.ls=v;break;case'Electric':u.aspd*=1+v;break;case'Fighting':u.fight=v;break;
   case'Dark':u.crit+=v;break;case'Normal':u.dm*=v;break;case'Fire':u.fire=v;break;case'Water':u.mg*=1+v;break;
   case'Flying':u.range+=v;break;case'Ice':u.ice=v;break;case'Rock':u.def+=v;break;case'Fairy':u.fairy=v;break;
   case'Bug':u.bug=v;break;case'Ground':u.ground=v;break;case'Poison':u.pois=v;break;case'Psychic':u.psy=1;break;case'Dragon':u.dragon=1}}
 return L}
function buildEnemy(){const g=EN[S.round-1],m=g.length,e=CFG.enemy,r=S.round,pr=Math.min(r,e.fRounds)/e.fRounds;
 const f=(e.fStart+(e.fEnd-e.fStart)*pr)*e.strength*(r<=5?e.early:1)*(r>=e.lateFrom?e.late:1);
 const n=limitFor(r),q=Math.min(r,45)/45;
 const D=n*28*(1+1.2*q),H=n*300*(1+q);
 const totalHP=D*e.T*f,totalDPS=H/(e.T*2.5)*f;
 return g.map((pk,j)=>mk('e',1,Math.floor((COLS-m)/2)+j,pk[0],pk[1],false,{
  hp:totalHP/m,atk:totalDPS/m/(e.aspd*1.2),aspd:e.aspd,def:e.def+r*e.defPerRound,
  crit:.1,range:CFG.base.range,mg:e.mg,skill:e.skill,big:m<=2}))}
function refreshView(){if(S.phase=='prep')B.units=buildPlayer(false).concat(buildEnemy())}
function spawnDecoys(v){const used=new Set(B.units.map(u=>u.r+','+u.c)),order=[];let n=0;
 for(let r=4;r<ROWS;r++)for(let c=0;c<COLS;c++)order.push([r,c]);
 order.sort((a,b)=>a[0]-b[0]||Math.abs(a[1]-4.5)-Math.abs(b[1]-4.5));
 for(const[r,c]of order){if(n>=v)break;if(used.has(r+','+c))continue;
  const d=mk('p',r,c,'Delegator',0,false,{hp:150+75*(v-1),atk:0,aspd:1,def:0,crit:0,range:0,mg:0,skill:1});d.decoy=true;B.units.push(d);n++}}

/* ================= KAMPF ================= */
function startBattle(){if(S.phase=='done'){newGame();return}if(S.phase!='prep')return;if(!placed().length){msg('Stelle mindestens ein Pokémon auf!');return}
 S.sel=null;S.speed=1;S.phase='battle';B.units=buildPlayer(true).concat(buildEnemy());B.fx=[];B.txt=[];B.fields=[];B.end=0;B.time=0;
 const gc=typeCounts().Ghost;if(gc){const v=bonusVal('Ghost',gc);if(v)spawnDecoys(v)}
 msg('');render()}
const asp=u=>u.aspd*(1+u.spdBuff)*(1-(u.slowT>0?u.slow:0));
const say=(t,s,col)=>B.txt.push({x:t.x,y:t.y-30,s,t:.7,col});
function dealDmg(t,d,col,pre){if(t.hp<=0)return;let rem=d;
 if(t.shield>0){const a=Math.min(t.shield,rem);t.shield-=a;rem-=a}
 t.hp-=rem;B.txt.push({x:t.x,y:t.y-30,s:(pre||'')+d,t:.7,col:col||'#fff'});
 if(t.hp<=0&&t.dragon&&!t.rev){t.rev=1;t.hp=t.max*.5;say(t,'🐉 Revive')}}
const heal=(u,a)=>{u.hp=Math.min(u.max,u.hp+a)};
function hit(u,t,A){u.cd=1/asp(u);u.mana+=u.mg;let m=1,cast=false;
 if(u.mana>=u.mmax){u.mana=0;m=u.skill;cast=true}
 u.atkN++;
 if(u.fire){if(u.fT===t)u.fN=Math.min(15,u.fN+1);else{u.fT=t;u.fN=0}}
 let fight=1;if(u.team=='p')for(const a of A)if(a.fight&&a.team==u.team&&a.hp>0&&dist(a,u)<=1)fight+=a.fight;
 let d=u.atk*m*u.dm*fight*(1+u.fire*u.fN);
 const crit=Math.random()<u.crit;if(crit)d*=2;
 d=Math.max(1,Math.round(d*100/(100+t.def)));
 u.lx=(t.x-u.x)*.2;u.ly=(t.y-u.y)*.2;
 B.fx.push({x1:u.x,y1:u.y,x2:t.x,y2:t.y,t:.15,col:cast?'#ff0':'#fff',w:cast?5:2});
 dealDmg(t,d,cast?'#ff0':crit?'#f84':'#fff',cast?'💥':crit?'!':'');
 if(u.ls)heal(u,d*u.ls);
 if(u.ice){t.slow=u.ice;t.slowT=3}
 if(u.pois){t.poisD=u.atk*u.pois;t.poisT=5}
 if(u.psy&&u.atkN%5==0){t.stun=1;say(t,'💫')}
 if(cast){
  if(u.fairy){let best=null;for(const a of A)if(a.team==u.team&&!a.decoy&&a.hp>0&&a.hp<a.max&&dist(a,u)<=3&&(!best||a.hp/a.max<best.hp/best.max))best=a;
   if(best){heal(best,best.max*u.fairy);say(best,'💚')}}
  if(u.ground)B.fields.push({team:u.team,r:t.r,c:t.c,t:5,acc:0,dmg:u.atk*u.ground,rad:2})}}
function step(dt){B.time+=dt;
 if(B.time>=CFG.speedUpAfter&&S.speed<CFG.speedUpTo){S.speed=CFG.speedUpTo;msg('⏩ Kampf dauert lange: Tempo erhöht!')}
const A=B.units.filter(u=>u.hp>0);
 for(const u of A){
  if(u.stun>0)u.stun-=dt;if(u.slowT>0)u.slowT-=dt;
  if(u.poisT>0){u.poisT-=dt;u.pAcc+=dt;if(u.pAcc>=1){u.pAcc-=1;dealDmg(u,Math.round(u.poisD),'#8c4','☠')}}
  if(u.bug&&!u.bugDone&&B.time>=8){u.bugDone=1;for(const a of A)if(a.team==u.team&&!a.decoy&&dist(a,u)<=3){a.spdBuff=Math.max(a.spdBuff,u.bug);say(a,'⚡')}}}
 for(const f of B.fields){f.t-=dt;f.acc+=dt;if(f.acc>=1){f.acc-=1;for(const o of A)if(o.hp>0&&o.team!=f.team&&dist(o,f)<=f.rad)dealDmg(o,Math.round(f.dmg),'#c84')}}
 B.fields=B.fields.filter(f=>f.t>0);
 for(const u of A){if(u.hp<=0||u.decoy)continue;u.cd-=dt;u.mv-=dt;if(u.stun>0)continue;
  const foes=A.filter(f=>f.team!=u.team&&f.hp>0);if(!foes.length)continue;
  const dec=foes.filter(f=>f.decoy),cand=dec.length?dec:foes;
  let t=cand[0],d=1e9;for(const f of cand){const x=dist(u,f);if(x<d){d=x;t=f}}
  if(d<=u.range){if(u.cd<=0)hit(u,t,A)}
  else if(u.mv<=0){let best=null,bd=d;
   for(const[dr,dc]of DIRS[u.r&1]){const r=u.r+dr,c=u.c+dc;if(r<0||r>=ROWS||c<0||c>=COLS)continue;
    if(A.some(o=>o.hp>0&&o.r==r&&o.c==c))continue;const x=dist({r,c},t);if(x<bd){bd=x;best={r,c}}}
   if(best){u.r=best.r;u.c=best.c}u.mv=.4}}
 B.fx.forEach(f=>f.t-=dt);B.fx=B.fx.filter(f=>f.t>0);B.txt.forEach(f=>{f.t-=dt;f.y-=dt*25});B.txt=B.txt.filter(f=>f.t>0);
 const pl=B.units.some(u=>u.team=='p'&&!u.decoy&&u.hp>0),en=B.units.some(u=>u.team=='e'&&u.hp>0);
 if(B.time>120){finish(false);return}
 if(!pl||!en){B.end+=dt;if(B.end>1.2)finish(pl)}}
function finish(win){if(S.phase!='battle')return;S.phase='prep';const last=S.round>=EN.length,oldL=limit();
 if(win&&last){S.phase='done';clearSave();msg('🏆 GEWONNEN! Du hast alle Gegner besiegt! Drücke ⚔️ Kampf! für ein neues Spiel.');B.units=[];render();return}
 S.gold+=income();
 if(win){S.round++;msg(`✅ Runde gewonnen! Jetzt Runde ${S.round}.`+(limit()>oldL?' 🔓 Neuer Platz freigeschaltet!':''))}
 else{S.lives--;if(S.lives<=0){S.phase='done';clearSave();msg('💀 Game Over – drücke ⚔️ Kampf! für ein neues Spiel.');render();return}
  msg(`❌ Verloren! Leben übrig: ${S.lives}. Die Runde wiederholt sich.`)}
 roll();save();render()}

/* ================= EINGABE (Klick + Drag & Drop) ================= */
function cellAt(cx,cy){const cv=$('cv'),b=cv.getBoundingClientRect(),mx=(cx-b.left)*cv.width/b.width,my=(cy-b.top)*cv.height/b.height;
 let hr=-1,hc=-1,bd=R;for(let r=4;r<ROWS;r++)for(let c=0;c<COLS;c++){const[x,y]=px(r,c),d=Math.hypot(x-mx,y-my);if(d<bd){bd=d;hr=r;hc=c}}
 return hr<0?null:{r:hr,c:hc}}
const occAt=c=>placed().find(u=>u.pos.r==c.r&&u.pos.c==c.c);
function moveTo(id,tgt){const o=unitById(id);if(!o)return;
 if(tgt=='trash'){sell(id);return}
 if(tgt=='bench'){if(o.pos){if(benchCount()>=CFG.benchMax){msg('Die Bank ist voll!');return}o.pos=null}return}
 const occ=occAt(tgt);
 if(occ===o)return;
 if(occ){occ.pos=o.pos;o.pos={r:tgt.r,c:tgt.c};return}
 if(!o.pos&&placed().length>=limit()){msg(`Max. ${limit()} Pokémon in dieser Runde!`);return}
 o.pos={r:tgt.r,c:tgt.c}}
function clickCell(c){if(!c){S.sel=null;render();return}
 const occ=occAt(c);
 if(S.sel!=null){if(occ&&occ.id==S.sel)S.sel=null;else{moveTo(S.sel,c);S.sel=null}}
 else if(occ)S.sel=occ.id;
 render()}
let D=null;
function bdown(e,id){if(S.phase!='prep')return;e.preventDefault();D={id,x:e.clientX,y:e.clientY,moved:false,from:'bench'}}
$('cv').addEventListener('pointerdown',e=>{if(S.phase!='prep')return;e.preventDefault();const c=cellAt(e.clientX,e.clientY),o=c?occAt(c):null;
 D={id:o?o.id:null,x:e.clientX,y:e.clientY,moved:false,from:'cv'}});
window.addEventListener('pointermove',e=>{if(!D)return;
 if(!D.moved&&D.id!=null&&Math.hypot(e.clientX-D.x,e.clientY-D.y)>6){D.moved=true;S.sel=null;
  const g=document.createElement('img');g.id='ghost';const u=unitById(D.id),sp=SP[u.sp];g.src=url(sp.id[u.star-1],sp.sh);document.body.appendChild(g);D.g=g}
 if(D.g){D.g.style.left=e.clientX-32+'px';D.g.style.top=e.clientY-32+'px';
  const el=document.elementFromPoint(e.clientX,e.clientY);$('trash').classList.toggle('over',!!(el&&el.closest('#trash')))}});
window.addEventListener('pointerup',e=>{if(!D)return;const d=D;D=null;if(d.g)d.g.remove();$('trash').classList.remove('over');
 if(d.moved){const el=document.elementFromPoint(e.clientX,e.clientY);let tgt=null;
  if(el===$('cv'))tgt=cellAt(e.clientX,e.clientY);else if(el&&el.closest('#trash'))tgt='trash';else if(el&&el.closest('#bench'))tgt='bench';
  if(tgt)moveTo(d.id,tgt);render();return}
 if(d.from=='bench'){S.sel=(S.sel==d.id)?null:d.id;render()}
 else clickCell(cellAt(e.clientX,e.clientY))});
window.addEventListener('pointercancel',()=>{if(D&&D.g)D.g.remove();D=null;$('trash').classList.remove('over')});

/* ================= TOOLTIP FÜR TYP-BONI ================= */
function tip(t,e){const cnt=typeCounts()[t]||0,k=tierIdx(t,cnt),tb=TB[t];
 const onB=new Set(placed().map(u=>u.sp)),own=new Set(S.units.map(u=>u.sp));
 let h=`<div>${typeBadge(t)} <b>${cnt}</b> aufgestellt</div>`+
  tb.th.map((x,j)=>`<div class="${j==k?'ta':''}"><b>${x} Pokémon:</b> ${tb.d(tb.v[j])}</div>`).join('')+
  `<div class="tl">Pokémon mit diesem Typ (hell = aufgestellt, blass = auf der Bank, dunkel = fehlt):</div><div class="tp">`+
  SP.map((s,i)=>s.t.includes(t)?`<div class="pc ${onB.has(i)?'on':own.has(i)?'own':''}"><img src="${url(s.id[0],s.sh)}">${s.n[0]}</div>`:'').join('')+'</div>';
 const el=$('tip');el.innerHTML=h;el.style.display='block';tipMove(e)}
function tipMove(e){const el=$('tip');el.style.left=Math.max(4,Math.min(e.clientX+16,innerWidth-el.offsetWidth-8))+'px';el.style.top=Math.max(4,Math.min(e.clientY+8,innerHeight-el.offsetHeight-8))+'px'}
function tipHide(){$('tip').style.display='none'}

/* ================= ANZEIGE ================= */
function slotInfo(){const T=CFG.slotAfter.find(t=>t>=S.round);
 if(limit()>=CFG.maxUnits||T==null)return`Alle ${CFG.maxUnits} Plätze freigeschaltet.`;
 const k=T-S.round+1;return`Nächster Platz (${limit()+1}.) nach Runde ${T} – noch ${k} Runde${k==1?'':'n'} (inkl. dieser).`}
function render(){if(!S)return;tipHide();const pl=placed().length;
 $('tr').innerHTML=`Runde <b>${S.round}/${EN.length}</b>`;
 $('tl').innerHTML=`❤️ <b>${S.lives}</b>`;
 $('tn').innerHTML=`Nächster Gegner: <b>${EN[Math.min(S.round,EN.length)-1].map(e=>e[0]).join(', ')}</b>`;
 $('gold').innerHTML=`💰 <b>${S.gold}</b> (+${income()} nächste Runde)`;
 $('plc').innerHTML=`Verfügbar: <b>${pl}/${limit()}</b>`;$('plc').title=slotInfo();
 const prep=S.phase=='prep';$('bBattle').disabled=S.phase=='battle';$('bRoll').disabled=!prep||S.gold<CFG.reroll;
 $('shop').innerHTML=S.shop.map((i,k)=>{if(i==null)return`<div class="card sold">–</div>`;const s=SP[i];
  return`<div class="card c${s.c}" onclick="buy(${k})"><img class="sp" src="${url(s.id[0],s.sh)}" onerror="this.style.opacity=.2"><b>${s.n[0]}</b><div class="tys">${s.t.map(typeIcon).join('')}</div><span class="co">${s.c} 💰</span></div>`}).join('');
 const bn=S.units.filter(u=>!u.pos);let bh='';
 for(let k=0;k<CFG.benchMax;k++){const u=bn[k];
  if(!u){bh+='<div class="card empty"></div>';continue}
  const s=SP[u.sp];
  bh+=`<div class="card c${s.c} ${S.sel==u.id?'sel':''}" onpointerdown="bdown(event,${u.id})"><img class="sp" src="${url(s.id[u.star-1],s.sh)}" onerror="this.style.opacity=.2" draggable="false"><b>${s.n[u.star-1]}</b>${starsHtml(u.star)}</div>`}
 $('bench').innerHTML=bh;$('benchH').textContent=`Bank (${bn.length}/${CFG.benchMax}) – ziehen oder antippen · 3 gleiche Einheiten verschmelzen · Mülleimer = verkaufen`;
 const cnt=typeCounts();
 $('buffs').innerHTML=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).map(t=>{const tb=TB[t],c=cnt[t],k=tierIdx(t,c);
  return`<div class="bf ${k>=0?'on':''}" onmouseenter="tip('${t}',event)" onmousemove="tipMove(event)" onmouseleave="tipHide()">${typeBadge(t)} <b>${c}</b><span class="th" style="float:right">${tb.th.map((x,j)=>`<i class="${c>=x?'r':''} ${j==k?'a':''}">${x}</i>`).join('')}</span><div class="bd">${k>=0?tb.d(tb.v[k]):'Noch nicht aktiv'}</div></div>`}).join('')||'<small>Stelle Pokémon auf, um Boni zu sehen.</small>';
 refreshView()}

/* ================= ZEICHNEN ================= */
const ctx=$('cv').getContext('2d');ctx.imageSmoothingEnabled=false;
function hexPath(x,y,r){ctx.beginPath();for(let k=0;k<6;k++){const a=Math.PI/180*(60*k-30);ctx[k?'lineTo':'moveTo'](x+r*Math.cos(a),y+r*Math.sin(a))}ctx.closePath()}
function draw(t){ctx.clearRect(0,0,720,500);
 const su=S&&S.sel!=null?unitById(S.sel):null,selPos=su?su.pos:null;
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const[x,y]=px(r,c);hexPath(x,y,R-1.5);
  ctx.fillStyle=r<4?'#2a2233':'#22302f';ctx.fill();const sl=selPos&&selPos.r==r&&selPos.c==c;ctx.strokeStyle=sl?'#ff0':'#3d4660';ctx.lineWidth=sl?3:1;ctx.stroke()}
 if(!S||!B.units)return;
 for(const f of B.fields){const[x,y]=px(f.r,f.c);ctx.fillStyle='rgba(200,130,50,.25)';ctx.beginPath();ctx.arc(x,y,f.rad*W*.9,0,7);ctx.fill()}
 const us=[...B.units].filter(u=>u.hp>0).sort((a,b)=>a.y-b.y);
 for(const u of us){const[tx,ty]=px(u.r,u.c);u.x+=(tx-u.x)*.18;u.y+=(ty-u.y)*.18;u.lx*=.85;u.ly*=.85;
  const bob=Math.sin(t/220+u.r*3+u.c)*2,x=u.x+u.lx,y=u.y+u.ly-8+bob,sz=u.big?96:80;
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(u.x,u.y+22,22,8,0,0,7);ctx.fill();
  if(u.decoy){ctx.fillStyle='#e8d36a';ctx.beginPath();ctx.arc(x,y,20,0,7);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(x-7,y-3,3,0,7);ctx.arc(x+7,y-3,3,0,7);ctx.fill();ctx.fillRect(x-6,y+7,12,2)}
  else{const im=imgOf(u.id,u.sh);
   if(im.complete&&im.naturalWidth&&!im.bad)ctx.drawImage(im,x-sz/2,y-sz/2,sz,sz);
   else{ctx.fillStyle=u.team=='p'?'#4a8':'#a54';ctx.beginPath();ctx.arc(x,y,24,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText(u.name.slice(0,7),x,y+4)}}
  const bw=50,by=u.y-46;ctx.fillStyle='#000';ctx.fillRect(u.x-bw/2,by,bw,6);
  ctx.fillStyle=u.team=='p'?'#4d4':'#d44';ctx.fillRect(u.x-bw/2,by,bw*Math.max(0,u.hp/u.max),6);
  if(u.shield>0){ctx.fillStyle='#9df';ctx.fillRect(u.x-bw/2,by-3,bw*Math.min(1,u.shield/u.max),3)}
  if(!u.decoy){ctx.fillStyle='#38f';ctx.fillRect(u.x-bw/2,by+7,bw*Math.min(1,u.mana/u.mmax),3)}
  if(u.star){ctx.fillStyle=STAR_COL[u.star-1];ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.font='bold 12px sans-serif';ctx.textAlign='center';
   const s='★'.repeat(u.star);ctx.strokeText(s,u.x,by-6);ctx.fillText(s,u.x,by-6)}
  if(u.stun>0){ctx.font='16px sans-serif';ctx.textAlign='center';ctx.fillText('💫',u.x,by-20)}
  if(u.poisT>0){ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('☠',u.x+28,by+6)}}
 for(const f of B.fx){ctx.strokeStyle=f.col;ctx.lineWidth=f.w;ctx.globalAlpha=Math.min(1,f.t*6);ctx.beginPath();ctx.moveTo(f.x1,f.y1);ctx.lineTo(f.x2,f.y2);ctx.stroke();ctx.globalAlpha=1}
 ctx.font='bold 14px sans-serif';ctx.textAlign='center';
 for(const f of B.txt){ctx.fillStyle=f.col;ctx.fillText(f.s,f.x,f.y)}}
let last=0;
function frame(t){const dt=Math.min((t-last)/1000,.05);last=t;
 if(S&&S.phase=='battle')for(let i=0;i<S.speed;i++){if(S.phase!='battle')break;step(dt)}
 draw(t);requestAnimationFrame(frame)}
if(!load())newGame();else{msg('Spielstand geladen.');render()}
requestAnimationFrame(frame);
</script></body></html>
