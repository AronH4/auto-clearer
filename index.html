<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auto-Clearer</title>
<style>
body{margin:0;background:#14161c;color:#eee;font-family:system-ui,sans-serif;padding:0 8px 20px;max-width:1320px;margin:auto}
button{background:#3b4a8a;color:#fff;border:0;border-radius:6px;padding:8px 12px;margin:2px;cursor:pointer;font-size:14px}
button:disabled{opacity:.4}button.red{background:#a33}
#bBattle{font-size:22px;font-weight:bold;padding:16px 34px}
#bRestart,#bRoll{font-size:22px;padding:12px 16px}
#top{position:sticky;top:0;z-index:20;background:#0e1016;border-bottom:2px solid #2c3350;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:15px}
#top .ttl{font-size:18px;color:#fc6}
#main{display:grid;grid-template-columns:225px 1fr 225px;gap:10px;margin-top:8px}
@media(max-width:980px){#main{grid-template-columns:1fr}}
#left,#right{position:sticky;top:56px;align-self:start;max-height:calc(100vh - 64px);overflow:auto;font-size:12px;background:#181c28;border:1px solid #2c3350;border-radius:8px;padding:8px}
#mid{min-width:0}
canvas{width:100%;background:#1d2230;border-radius:8px;touch-action:none;display:block}
#ctrl{display:flex;flex-direction:column;gap:6px;padding:6px 2px}
#btns{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
#stat{display:flex;flex-wrap:wrap;gap:4px 20px;font-size:15px}#plc{cursor:help;border-bottom:1px dotted #889}
#under{text-align:center}#under h4{text-align:center;margin:12px 0 2px}
#shop,#bench{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}#shop{justify-content:center}
.card{width:100px;height:132px;box-sizing:border-box;border:2px solid #888;border-radius:8px;padding:4px;background:#222736;font-size:12px;
 display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;cursor:pointer;user-select:none;position:relative}
.card img.sp{width:60px;height:60px;image-rendering:pixelated}
.card b{font-size:12px;line-height:1.1}.card .co{color:#fd6;font-size:12px}.card .cl{font-size:10px;color:#9ab}
.card.empty{border:2px dashed #3a4258;background:transparent;cursor:default}
.c1{border-color:#ddd}.c2{border-color:#4c4}.c3{border-color:#48f}.c4{border-color:#a5f}.c5{border-color:#f93}
.card.sold{opacity:.25;pointer-events:none}.card.sel{outline:3px solid #ff0}
#bench .card{touch-action:none}#bench .card.empty{cursor:pointer}
.tys{display:flex;gap:3px;justify-content:center}
.ti{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#fff;overflow:hidden}
.ti img{width:18px;height:18px}
.tb{display:inline-flex;align-items:center;gap:4px;border-radius:12px;padding:1px 8px 1px 2px;color:#fff;font-weight:bold;text-shadow:0 0 3px #000}
.tb img{width:18px;height:18px}
.bf{border:1px solid #2c3350;border-radius:8px;padding:5px;margin-bottom:6px;background:#1a1e2b;opacity:.6}.bf.on{opacity:1;border-color:#6a7bd0}
.th i{font-style:normal;display:inline-block;min-width:16px;text-align:center;border-radius:4px;margin-left:3px;background:#2c3350;color:#889}
.th i.r{background:#44527f;color:#fff}.th i.a{background:#e8b923;color:#000}
.bd{margin-top:3px;color:#cdd}
h4{margin:8px 0 2px;color:#9ab}
#ghost{position:fixed;width:64px;height:64px;pointer-events:none;z-index:99;image-rendering:pixelated;opacity:.85}
#benchRow{display:flex;gap:8px;align-items:stretch;justify-content:center}
#bench{
  display: flex;
  gap: 6px;
  overflow-x: auto;
  white-space: nowrap;
  padding-bottom: 4px;
}
#bench .card{
  flex: 0 0 100px; /* Zwingt jede Karte exakt auf 100px Breite, ohne zu schrumpfen */
  width: 100px;
  height: auto;
  min-height: 94px;
}

#bench .card{width:auto;height:auto;min-height:94px;padding:2px;gap:1px}
#bench .card img.sp{width:100%;max-width:50px;height:auto;aspect-ratio:1}
#bench .card b{font-size:10px;line-height:1.05}
#trash{width:78px;border:2px dashed #a55;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:28px;cursor:pointer;color:#c88}
#trash small{font-size:11px}#trash.over{background:#5a2020;border-style:solid}
#tip{position:fixed;z-index:50;background:#0e1016;border:1px solid #6a7bd0;border-radius:8px;padding:8px;max-width:340px;font-size:12px;pointer-events:none;display:none}
#tip .ta{color:#fd6}#tip .tl{margin:6px 0 3px;color:#9ab}
#tip .tp{display:flex;flex-wrap:wrap;gap:3px}
#tip .pc{display:flex;align-items:center;width:102px;font-size:10px;border:1px solid #333;border-radius:6px;padding:1px;opacity:.3}
#tip .pc.own{opacity:.7}#tip .pc.on{opacity:1;border-color:#5c5;background:#1c2b1c}
#tip .pc img{width:28px;height:28px;image-rendering:pixelated}
#crownBox{display:inline-flex;align-items:center;justify-content:center;background:#2a2414;border:2px solid #ffd700;border-radius:8px;padding:8px 14px;cursor:grab;user-select:none;font-size:26px;line-height:1}
#crownBox.hidden{display:none}
/* DPS-Chart rechts */
.dps-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;background:#131620;border:1px solid #282f48;border-radius:6px;padding:4px 6px}
.dps-row img{width:34px;height:34px;image-rendering:pixelated;flex-shrink:0}
.dps-info{flex:1;min-width:0}
.dps-top{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px;gap:4px}
.dps-top b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#eee}
.dps-top span{color:#fd6;font-weight:bold;white-space:nowrap}
.dps-bar-bg{height:6px;background:#252b3d;border-radius:3px;overflow:hidden}
.dps-bar{height:100%;background:linear-gradient(90deg,#4a9eff,#6ce5ff);border-radius:3px;transition:width .12s}
</style></head><body>
<div id="top"><b class="ttl">Auto-Clearer</b><span id="tr"></span><span id="tl"></span><span id="tn"></span></div>
<div id="main">
 <div id="left"><h4 style="margin-top:0">Typ-Boni</h4><div id="buffs"></div><small style="color:#889">Maus über Typ/Pokémon = Details</small></div>
 <div id="mid">
  <canvas id="cv" width="720" height="500"></canvas>
  <div id="ctrl">
   <div id="btns"><button id="bBattle" onclick="startBattle()">⚔️ Kampf!</button>
   <button id="bRoll" onclick="reroll()" title="Neu würfeln (2 Gold)">🎲</button>
   <button class="red" id="bRestart" onclick="restart()" title="Match neu starten">🔄</button>
   <span id="crownBox" class="hidden" title="Käfer-Krone: Auf ein aufgestelltes Pokémon ziehen (+10% ATK, ASPD & Mana/ATK)">👑</span></div>
   <div id="stat"><span id="gold"></span><span id="plc"></span></div>
  </div>
  <div id="under">
   <h4>Shop</h4><div id="shop"></div>
   <h4>Bank</h4>
   <div id="benchRow"><div id="bench"></div><div id="trash" onclick="trashClick()" title="Pokémon hierher ziehen, um sie zu verkaufen">🗑️<small>Verkaufen</small></div></div>
  </div>
 </div>
 <div id="right"><h4 style="margin-top:0">📊 DMG / DPS (Runde)</h4><div id="dpsChart"><small style="color:#889">Starte einen Kampf, um den Schaden zu sehen.</small></div></div>
</div>
<div id="tip"></div>

<script>
/* ================= KONFIGURATION ================= */
const CFG={startGold:10,income:5,reroll:2,lives:10,
 tempo:1.3,moveDelay:.3,
 maxUnits:11,slotAfter:[1,3,5,8,11,15,20,26,33,40],benchMax:14,
 speedUpAfter:20,speedUpTo:3,
 /* Sterne-Faktoren für HP & ATK: 1★ = 1.0, 2★ = 1.75, 3★ = 3.0 */
 hpMul:[1,1.75,3],atkMul:[1,1.75,3],
 /* Cost-Unit-Faktoren für HP & ATK */
 costMul:{1:1,2:1.1,3:1.15,4:1.2,5:1.25},
 base:{hp:300,atk:30,aspd:0.8,def:10,crit:0.1,range:2,mana:100,manaGain:15},
 copies:{1:22,2:18,3:15,4:12,5:9},
 mergeNeeded:3,
 /* Gleichmäßigere Shop-Verteilung: 1-Costs bleiben bis ins Endgame gut auffindbar, 5-Costs bleiben selten */
 odds:[
  [3,[65,30,5,0,0]],
  [7,[48,34,15,3,0]],
  [13,[36,32,22,8,2]],
  [21,[28,30,25,13,4]],
  [32,[24,27,26,17,6]],
  [999,[22,25,25,20,8]]
 ],
 /* Deutlich gestaffelte Gegner-Skalierung:
    - Runden 1-5: machbarer Einstieg
    - Ab Runde 6: spürbar stärker
    - Ab Runde 15: deutlich härter
    - Ab Runde 30: starke Mid-/Lategame-Teams
    - Ab Runde 42: echte Endgame-Herausforderung */
 enemy:{
  strength:1.0,
  T:15,
  fStart:0.85,
  fEnd:1.2,
  fRounds:52,
  early:0.90,
  from6:1.0,
  from15:1.03,
  from30:1.03,
  from42:1.03,
  aspd:0.8,
  skill:2,
  def:10,
  defPerRound:1.05,
  mg:12,
  dmg:1.1,
  dmgGrow:1.0
 }
};

/* ================= KLASSEN (laut Tabelle) ================= */
const CLASSES={
 Tank:   {hp:400,atk:35,abDmg:70, def:25,aspd:0.7,crit:0.10,range:1,mg:15,icon:'🛡️'},
 Fighter:{hp:350,atk:45,abDmg:90, def:20,aspd:0.9,crit:0.20,range:2,mg:15,icon:'⚔️'},
 Caster: {hp:300,atk:35,abDmg:110,def:15,aspd:0.9,crit:0.10,range:3,mg:20,icon:'🔮'},
 Sniper: {hp:250,atk:40,abDmg:80, def:15,aspd:1.5,crit:0.10,range:5,mg:15,icon:'🎯'}
};

/* ================= FÄHIGKEITEN-BESCHREIBUNGEN ================= */
const SKILLS={
 'Close Combat':{col:'#ff3b3b',desc:'Rote Nahkampf-Explosion: Verursacht 10 + Ability DMG an allen Gegnern im Umkreis von 2 Feldern.'},
 'Snipe Shot':  {col:'#ffe63b',desc:'Gelber Laserstrahl: Trifft alle Gegner auf der Linie zum Ziel und verursacht Ability DMG.'},
 'Reflect':     {col:'#ff66cc',desc:'Pinke Barriere: Baut links, mittig und rechts vor dem Anwender für 4s eine Barriere auf (-50% Projektil-Schaden).'},
 'Bulldoze':    {col:'#c87d32',desc:'Brauner Ansturm: Dasht sofort zum Gegner mit den meisten HP und verursacht Ability DMG.'},
 'Weather Ball':{col:'#ffffff',desc:'Weiße Energiekugel: Feuert ein Projektil auf den Gegner mit den meisten HP; trifft Ziel und angrenzende Gegner (1 Feld) für Ability DMG.'}
};

const BASE='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/';
const TYPE_URL={"Normal": "https://www.pokewiki.de/images/thumb/8/85/Typ-Icon_Normal_%28Symbol%29_PLA.png/32px-Typ-Icon_Normal_%28Symbol%29_PLA.png", "Fighting": "https://www.pokewiki.de/images/thumb/3/3c/Typ-Icon_Kampf_%28Symbol%29_PLA.png/32px-Typ-Icon_Kampf_%28Symbol%29_PLA.png", "Flying": "https://www.pokewiki.de/images/thumb/0/00/Typ-Icon_Flug_%28Symbol%29_PLA.png/32px-Typ-Icon_Flug_%28Symbol%29_PLA.png", "Poison": "https://www.pokewiki.de/images/thumb/b/b5/Typ-Icon_Gift_%28Symbol%29_PLA.png/32px-Typ-Icon_Gift_%28Symbol%29_PLA.png", "Ground": "https://www.pokewiki.de/images/thumb/c/cc/Typ-Icon_Boden_%28Symbol%29_PLA.png/32px-Typ-Icon_Boden_%28Symbol%29_PLA.png", "Rock": "https://www.pokewiki.de/images/thumb/0/0a/Typ-Icon_Gestein_%28Symbol%29_PLA.png/32px-Typ-Icon_Gestein_%28Symbol%29_PLA.png", "Bug": "https://www.pokewiki.de/images/thumb/f/fd/Typ-Icon_K%C3%A4fer_%28Symbol%29_PLA.png/32px-Typ-Icon_K%C3%A4fer_%28Symbol%29_PLA.png", "Ghost": "https://www.pokewiki.de/images/thumb/c/c0/Typ-Icon_Geist_%28Symbol%29_PLA.png/32px-Typ-Icon_Geist_%28Symbol%29_PLA.png", "Steel": "https://www.pokewiki.de/images/thumb/2/2b/Typ-Icon_Stahl_%28Symbol%29_PLA.png/32px-Typ-Icon_Stahl_%28Symbol%29_PLA.png", "Fire": "https://www.pokewiki.de/images/thumb/f/f0/Typ-Icon_Feuer_%28Symbol%29_PLA.png/32px-Typ-Icon_Feuer_%28Symbol%29_PLA.png", "Water": "https://www.pokewiki.de/images/thumb/b/b6/Typ-Icon_Wasser_%28Symbol%29_PLA.png/32px-Typ-Icon_Wasser_%28Symbol%29_PLA.png", "Grass": "https://www.pokewiki.de/images/thumb/8/82/Typ-Icon_Pflanze_%28Symbol%29_PLA.png/32px-Typ-Icon_Pflanze_%28Symbol%29_PLA.png", "Electric": "https://www.pokewiki.de/images/thumb/a/a9/Typ-Icon_Elektro_%28Symbol%29_PLA.png/32px-Typ-Icon_Elektro_%28Symbol%29_PLA.png", "Psychic": "https://www.pokewiki.de/images/thumb/1/12/Typ-Icon_Psycho_%28Symbol%29_PLA.png/32px-Typ-Icon_Psycho_%28Symbol%29_PLA.png", "Ice": "https://www.pokewiki.de/images/thumb/d/d8/Typ-Icon_Eis_%28Symbol%29_PLA.png/32px-Typ-Icon_Eis_%28Symbol%29_PLA.png", "Dragon": "https://www.pokewiki.de/images/thumb/6/6f/Typ-Icon_Drache_%28Symbol%29_PLA.png/32px-Typ-Icon_Drache_%28Symbol%29_PLA.png", "Dark": "https://www.pokewiki.de/images/thumb/5/58/Typ-Icon_Unlicht_%28Symbol%29_PLA.png/32px-Typ-Icon_Unlicht_%28Symbol%29_PLA.png", "Fairy": "https://www.pokewiki.de/images/thumb/6/6c/Typ-Icon_Fee_%28Symbol%29_PLA.png/32px-Typ-Icon_Fee_%28Symbol%29_PLA.png"};
const SPRITE_OVERRIDE={};
const STAR_COL=['#cd7f32','#c0c0c0','#ffd700'];

const TYPES={Normal:[1,'Normal','#a8a77a'],Fighting:[2,'Kampf','#c22e28'],Flying:[3,'Flug','#a98ff3'],Poison:[4,'Gift','#a33ea1'],
 Ground:[5,'Boden','#c9a24a'],Rock:[6,'Gestein','#a08f2e'],Bug:[7,'Käfer','#a6b91a'],Ghost:[8,'Geist','#735797'],Steel:[9,'Stahl','#8d8da8'],
 Fire:[10,'Feuer','#ee8130'],Water:[11,'Wasser','#6390f0'],Grass:[12,'Pflanze','#7ac74c'],Electric:[13,'Elektro','#d9b300'],
 Psychic:[14,'Psycho','#f95587'],Ice:[15,'Eis','#6fc3c0'],Dragon:[16,'Drache','#6f35fc'],Dark:[17,'Unlicht','#705746'],Fairy:[18,'Fee','#d685ad']};
const p=v=>Math.round(v*100)+'%';

/* ================= TYP-BONI ================= */
const DECOY_HP=[150,300,500];
const TB={
 Normal:  {th:[3],    v:[3],          d:v=>`Alle Normal-Pokémon verursachen ${v}x Schaden mit Attacks und Abilities`},
 Grass:   {th:[2,4],  v:[.20,.50],    d:v=>`Alle Pflanzen-Pokémon heilen sich um ${p(v)} des verursachten Schadens`},
 Fire:    {th:[2,3],  v:[.15,.25],    d:v=>`Alle Feuer-Pokémon verringern den ATK-Stat des Ziels um ${p(v)} und hinterlassen einen schwachen DoT`},
 Water:   {th:[2,3],  v:[.50,.75],    d:v=>`Alle Wasser-Pokémon erhalten +${p(v)} mehr Mana pro Attack`},
 Electric:{th:[2,4],  v:[.25,.50],    d:v=>`Alle Elektro-Pokémon erhalten +${p(v)} Attack Speed`},
 Bug:     {th:[1],    v:[.10],        d:v=>`Käfer-Krone erscheint! Träger erhält +10% ATK, Attack Speed und Mana pro ATK`},
 Flying:  {th:[2,3],  v:[1,2],        d:(v,k)=>k===1?`Alle Flug-Pokémon erhalten +1 Feld Reichweite und +2,5 ATK je Distanz-Feld zum Gegner`:`Alle Flug-Pokémon erhalten +1 Feld Reichweite`},
 Fighting:{th:[2,4],  v:[.20,.40],    d:v=>`Alle Kampf-Pokémon buffen den ATK-Stat umliegender Allies (1 Feld) um ${p(v)}`},
 Rock:    {th:[2],    v:[25],         d:v=>`Alle Gestein-Pokémon erhalten +${v} DEF`},
 Ground:  {th:[1],    v:[150],         d:v=>`Alle Boden-Pokémon schleichen bei Rundenbeginn ans hintere Ende der Gegner (+${v} Schaden beim 1. Angriff)`},
 Steel:   {th:[2,3,5],v:[.25,.40,.75],d:v=>`Alle Stahl-Pokémon starten mit einem Schild von ${p(v)} der maximalen HP`},
 Psychic: {th:[1],    v:[2.5],        d:v=>`Jeder 7. Angriff versetzt das Ziel für 2,5s in den Berserker-Modus oder stunnt es`},
 Ghost:   {th:[2,3,5],v:[200,350,600],d:v=>`1 frei platzierbarer Delegator mit ${v} HP erscheint vor Rundenstart`},
 Poison:  {th:[1],    v:[.25],        d:v=>`Alle Gift-Pokémon vergiften das Ziel für ${p(v)} ATK pro Sekunde (5s)`},
 Dark:    {th:[2,4],  v:[.40,.90],    d:v=>`Alle -Pokémon erhalten einen Crit Chance Buff auf ${p(v)}`},
 Ice:     {th:[2,3],  v:[.20,.30],    d:v=>`Alle Eis-Pokémon verringern den Attack Speed des Ziels um ${p(v)} (3s)`},
 Dragon:  {th:[1],    v:[.50],        d:v=>`Alle Drachen-Pokémon werden nach ihrem ersten Tod mit ${p(v)} Leben wiederbelebt`},
 Fairy:   {th:[2],    v:[.60],        d:v=>`Alle Feen-Pokémon heilen beim Einsatz ihrer Ability umliegende Allies (1 Feld) um 60% max HP`}
};
const tierIdx=(t,c)=>{let k=-1;TB[t].th.forEach((x,j)=>{if(c>=x)k=j});return k};
const bonusVal=(t,c)=>{const k=tierIdx(t,c);return k<0?0:TB[t].v[k]};
const typeIcon=t=>{const T=TYPES[t];return`<span class="ti" style="background:${T[2]}" title="${T[1]}" data-l="${T[1][0]}"><img src="${TYPE_URL[t]}" onerror="this.parentNode.textContent=this.parentNode.dataset.l"></span>`};
const typeBadge=t=>{const T=TYPES[t];return`<span class="tb" style="background:${T[2]}"><img src="${TYPE_URL[t]}" onerror="this.remove()">${T[1]}</span>`};
const starsHtml=n=>`<span style="color:${STAR_COL[n-1]};text-shadow:0 0 2px #000">${'★'.repeat(n)}</span>`;

/* ================= POKÉMON-POOL ================= */
const RAW=[
[1,'Nebulak,Alpollo,Gengar','92,93,94','Ghost,Poison','Caster','Close Combat'],
[1,'Samurzel,Blanas,Tengulist','273,274,275','Grass,Dark','Fighter','Snipe Shot'],
[1,'Wingull,Pelipper,Pelipper','278,279,279','Water,Flying','Caster','Weather Ball'],
[1,'Ganovil,Rokkaiman,Rabigator','551,552,553','Ground,Dark','Fighter','Close Combat'],
[1,'Dartiri,Dartignis,Fiaro','661,662,663','Fire,Flying','Sniper','Snipe Shot'],
[1,'Eguana,Elezard,Elezard','694,695,695','Electric,Normal','Sniper','Snipe Shot'],
[1,'Alola-Sandan,Alola-Sandamer,Alola-Sandamer','10101,10102,10102','Ice,Steel','Fighter','Bulldoze'],
[1,'Meikro ✨,Kranoviz ✨,Krarmor ✨','821,822,823','Flying,Steel','Tank','Snipe Shot',1],
[1,'Pamo,Pamamo,Pamomamo','921,922,923','Electric,Fighting','Fighter','Reflect'],
[1,'Geosali,Sedisal,Saltigant','932,933,934','Rock','Tank','Bulldoze'],
[2,'Shnebedeck,Rexblisar,Rexblisar','459,460,460','Grass,Ice','Tank','Weather Ball'],
[2,'Fukano,Arkani,Arkani','58,59,59','Fire','Fighter','Weather Ball'],
[2,'Mampfaxo,Relaxo,Relaxo','446,143,143','Normal','Tank','Bulldoze'],
[2,'Stollunior,Stollrak,Stolloss','304,305,306','Steel,Rock','Tank','Bulldoze'],
[2,'Monozyto,Mitodos,Zytomega','577,578,579','Psychic','Caster','Reflect'],
[2,'Gramokles,Duokles,Durengard','679,680,681','Steel,Ghost','Tank','Reflect'],
[2,'Galar-Porenta,Lauchzelot,Lauchzelot','10166,865,865','Fighting','Fighter','Bulldoze'],
[2,'Bähmon,Pelzebub,Olangaar','859,860,861','Dark,Fairy','Fighter','Reflect'],
[3,'Panflam,Panpyro,Panferno','390,391,392','Fire,Fighting','Fighter','Close Combat'],
[3,'Karnimani,Tyracroc,Impi','158,159,160','Water','Fighter','Close Combat'],
[3,'Evoli,Nachtara,Nachtara','133,197,197','Dark','Caster','Reflect'],
[3,'Pichu,Pikachu,Pikachu','172,25,25','Electric','Sniper','Weather Ball'],
[3,'Igamaro,Igastarnish,Brigaron','650,651,652','Grass,Fighting','Tank','Close Combat'],
[3,'Bauz,Arboretoss,Silvarro','722,723,724','Grass,Ghost','Sniper','Snipe Shot'],
[4,'Rotom,Rotom,Rotom','479,479,479','Electric,Ghost','Sniper','Reflect'],
[4,'Fermicula,Fermicula,Fermicula','632,632,632','Bug,Steel','Fighter','Close Combat'],
[4,'Curelei,Curelei,Curelei','764,764,764','Fairy','Caster','Weather Ball'],
[4,'Grolldra,Phandra,Katapuldra','885,886,887','Dragon,Ghost','Sniper','Snipe Shot'],
[5,'Arceus,Arceus,Arceus','493,493,493','Normal','Caster','Bulldoze'],
[5,'Eisenbündel,Eisenbündel,Eisenbündel','991,991,991','Ice,Water','Caster','Snipe Shot']
];

const SP=RAW.map(r=>({
 c:r[0],
 n:r[1].split(','),
 id:r[2].split(',').map(Number),
 t:r[3].split(','),
 cls:r[4],
 ab:r[5],
 sh:!!r[6],

function freeSlot(){for(let k=0;k<CFG.benchMax;k++)if(!S.units.some(u=>!u.pos&&u.slot===k))return k;return null}
function fixSlots(){const used=new Set();S.units.forEach(u=>{if(u.pos){u.slot=null;return}
  if(u.slot==null||u.slot>=CFG.benchMax||used.has(u.slot))u.slot=null;else used.add(u.slot)});

function newGame(){
 S={round:1,gold:CFG.startGold,lives:CFG.lives,units:[],nextId:1,shop:[],phase:'prep',sel:null,speed:1,pool:{},decoyPos:null,crownOn:null};
 SP.forEach((s,i)=>S.pool[i]=CFG.copies[s.c]);

function save(){try{localStorage.setItem('pab6',JSON.stringify(S))}catch(e){}}

function load(){try{const s=JSON.parse(localStorage.getItem('pab6'));if(s&&s.pool&&s.units){S=s;S.phase='prep';S.speed=1;fixSlots();return true}}catch(e){}return false}

function roll(){S.shop=[];const tier=CFG.odds.find(o=>S.round<=o[0])[1];
 for(let k=0;k<5;k++){
  const av=SP.map((s,i)=>({i,c:s.c,w:S.pool[i]})).filter(x=>x.w>0&&!S.units.some(u=>u.sp==x.i&&u.star==3));
  const costs=[1,2,3,4,5].filter(c=>av.some(x=>x.c==c)&&tier[c-1]>0);
  if(!costs.length){S.shop.push(null);continue}
  let r=Math.random()*costs.reduce((a,c)=>a+tier[c-1],0),cost=costs[0];
  for(const c of costs){r-=tier[c-1];if(r<=0){cost=c;break}}
  const cand=av.filter(x=>x.c==cost);let w=Math.random()*cand.reduce((a,x)=>a+x.w,0),pick=cand[0].i;
  for(const x of cand){w-=x.w;if(w<=0){pick=x.i;break}}
  S.shop.push(pick)}}
function reroll(){if(!act()||S.gold<CFG.reroll)return;S.gold-=CFG.reroll;roll();render()}
function freeHex(){for(let r=4;r<ROWS;r++)for(let c=0;c<COLS;c++)if(!occAt({r,c})&&!(S.decoyPos&&S.decoyPos.r==r&&S.decoyPos.c==c))return{r,c};return null}

function tryMerge(){let again=true;const bat=S.phase=='battle';
 while(again){again=false;
  for(let sp=0;sp<SP.length&&!again;sp++)for(let st=1;st<=2&&!again;st++){
   const L=S.units.filter(u=>u.sp==sp&&u.star==st&&(!bat||!u.pos)).sort((a,b)=>(b.pos?1:0)-(a.pos?1:0));
   if(L.length>=CFG.mergeNeeded){const t=L.slice(0,CFG.mergeNeeded),pos=t[0].pos,keep=t.find(x=>!x.pos&&x.slot!=null);
    const hadCrown=t.some(x=>S.crownOn===x.id);
    const nid=S.nextId++;
    S.units=S.units.filter(u=>!t.includes(u));
    S.units.push({id:nid,sp,star:st+1,pos,slot:pos?null:(keep?keep.slot:freeSlot())});
    if(hadCrown)S.crownOn=nid;
    again=true}}}}

function buy(k){if(!act())return;const i=S.shop[k];if(i==null)return;const s=SP[i];
 if(S.gold<s.c)return;
 if(S.units.some(u=>u.sp==i&&u.star==3))return;
 const bat=S.phase=='battle';
 const wouldMerge=S.units.filter(u=>u.sp==i&&u.star==1&&(!bat||!u.pos)).length>=CFG.mergeNeeded-1;
 let autoPos=null;
 if(benchCount()>=CFG.benchMax&&!wouldMerge){
  if(!bat&&placed().length<limit())autoPos=freeHex();
  if(!autoPos)return}
 S.gold-=s.c;S.pool[i]--;S.shop[k]=null;
 S.units.push({id:S.nextId++,sp:i,star:1,pos:autoPos,slot:autoPos?null:freeSlot()});
 tryMerge();
 render()}

function sell(id){const u=unitById(id);if(!u)return;const n=cardsEq(u),g=SP[u.sp].c*n;
 if(S.crownOn===id)S.crownOn=null;
 S.gold+=g;S.pool[u.sp]+=n;S.units=S.units.filter(x=>x!==u)}
function trashClick(){if(!act()||S.sel==null)return;const u=unitById(S.sel);if(S.phase=='battle'&&u&&u.pos)return;sell(S.sel);S.sel=null;render()}

function typeCounts(){const c={},seen=new Set();placed().forEach(u=>{if(seen.has(u.sp))return;seen.add(u.sp);SP[u.sp].t.forEach(t=>c[t]=(c[t]||0)+1)});return c}

function ensureSpecials(){
 const cnt=typeCounts();
 if((cnt.Ghost||0)>=2){
  if(!S.decoyPos||occAt(S.decoyPos)){
   const h=freeHex();
   S.decoyPos=h||{r:4,c:4};
  }
 }else{
  S.decoyPos=null;
 }
 if((cnt.Bug||0)>=1){
  if(S.crownOn!=null){
   const u=unitById(S.crownOn);
   if(!u||!u.pos)S.crownOn=null;
  }

  S.crownOn=null;
 }
}

function applyBonus(u,t,v,tier){
 switch(t){
  case'Steel':u.shield=u.max*v;break;
  case'Grass':u.ls=v;break;
  case'Electric':u.aspd*=1+v;break;
  case'Fighting':u.fight=v;break;
  case'Dark':u.crit=Math.max(u.crit,v);break;
  case'Normal':u.dm*=v;break;
  case'Fire':u.fire=v;break;
  case'Water':u.mg*=1+v;break;
  case'Flying':u.range+=1;if(tier===1)u.flyBonus=2.5;break;
  case'Ice':u.ice=v;break;
  case'Rock':u.def+=v;break;
  case'Fairy':u.fairy=v;break;
  case'Ground':u.ground=v;break;
  case'Poison':u.pois=v;break;
  case'Psychic':u.psy=1;break;
  case'Dragon':u.dragon=v;break;
 }
}

function buildPlayer(bat){
 const cnt=typeCounts();
 const L=placed().map(o=>{
  const s=SP[o.sp],st=o.star,ov=s.s;
  const cl=CLASSES[s.cls]||CLASSES.Fighter;
  const cMul=CFG.costMul[s.c]||1;
  const sMulHp=CFG.hpMul[st-1]||1;
  const sMulAtk=CFG.atkMul[st-1]||1;
  const hp=(ov.hp||cl.hp)*cMul*sMulHp;
  const atk=(ov.atk||cl.atk)*cMul*sMulAtk;
  const abDmg=(ov.abDmg||cl.abDmg)*cMul*sMulAtk;
  const u=mk('p',o.pos.r,o.pos.c,s.n[st-1],s.id[st-1],s.sh,{
   hp,atk,abDmg,
   aspd:ov.aspd||cl.aspd,
   def:ov.def||cl.def,
   crit:ov.crit??cl.crit,
   range:ov.range||cl.range,
   mg:ov.mg||cl.mg,
   abName:s.ab,
   cls:s.cls,
   star:st,
   uid:o.id
  });
  u.t=s.t;
  if(S.crownOn===o.id&&(cnt.Bug||0)>=1){
   u.crowned=true;
   u.atk*=1.10;
   u.aspd*=1.10;
   u.mg*=1.10;
  }
  return u;
 });
 if(bat){
  for(const u of L){
   for(const t of u.t){
    const k=tierIdx(t,cnt[t]);
    if(k>=0)applyBonus(u,t,TB[t].v[k],k);
   }
  }
 }
 return L;
}

function buildEnemy(){
 const g=ENEMIES[Math.min(S.round,ENEMIES.length)-1],m=g.length,e=CFG.enemy,r=S.round,pr=Math.min(r,e.fRounds)/e.fRounds;
 const stageMult=

 const f=(e.fStart+(e.fEnd-e.fStart)*pr)*e.strength*stageMult;
 const n=limitFor(r),q=Math.min(r,52)/52;
 const D=n*34*(1+1.55*q),H=n*360*(1+1.35*q);

 // --- NEU: Automatische Dämpfung für Einzelgegner, Revive & Split ---
 const soloFactor = (m === 1) ? 0.78 : 1; // Einzelgegner (wie Hoopa/Necrozma) haben 22% weniger Gesamt-Pool
 const phaseFactor = g.some(d => d.revive || d.split) ? 0.82 : 1; // Runden mit 2. Phase sind 18% schwächer

 const totalHP = D * e.T * f * soloFactor * phaseFactor;
 const totalDPS = (H / (e.T * 2.2)) * f * soloFactor * phaseFactor;
 // -------------------------------------------------------------------

 const dmgF=e.dmg*(1+e.dmgGrow*q);
 const wH=g.reduce((s,d)=>s+(d.hpX||1),0),wA=g.reduce((s,d)=>s+(d.atkX||1),0);
 return g.map((d,j)=>{const pos=d.pos||[1,Math.floor((COLS-m)/2)+j];
  const u=mk('e',pos[0],pos[1],d.name,d.sprite,!!d.shiny,{
   hp:d.hp??totalHP*(d.hpX||1)/wH,
   atk:d.atk??totalDPS*dmgF*(d.atkX||1)/wA/(e.aspd*1.15),
   aspd:d.aspd??e.aspd,
   def:d.def??(e.def+r*e.defPerRound),
   crit:d.crit??.12,
   range:d.range??CFG.base.range,
   mg:d.mg??e.mg,
   mmax:d.mana,
   skill:d.skill??e.skill,
   big:d.big??m<=2
  });
  u.t=Object.keys(d.bonus||{});for(const t of u.t)applyBonus(u,t,d.bonus[t],0);
  u.onCast=d.cast||null;u.fb=d.fb??null;u.reviveTo=d.revive||null;u.split=d.split||null;u.die=d.die||null;return u});
}

/* ================= DPS-CHART ================= */
function recordDamage(attacker,amount){
 if(!attacker||attacker.team!='p'||attacker.decoy||!attacker.uid||amount<=0)return;
 const entry=B.dps.find(x=>x.uid===attacker.uid);
 if(entry)entry.dmg+=amount;
}

function renderDpsChart(){
 const el=$('dpsChart');
 if(!el)return;
 if(!B.dps||!B.dps.length){
  el.innerHTML='<small style="color:#889">Starte einen Kampf, um den Schaden zu sehen.</small>';
  return;
 }
 const sorted=[...B.dps].sort((a,b)=>b.dmg-a.dmg);
 const maxDmg=Math.max(1,sorted[0].dmg);
 const elapsed=Math.max(0.5,B.time||0.5);
 el.innerHTML=sorted.map(item=>{
  const pct=Math.min(100,Math.round((item.dmg/maxDmg)*100));
  const total=Math.round(item.dmg);
  const perSec=Math.round(item.dmg/elapsed);
  return`<div class="dps-row">
   <img src="${url(item.spriteId,item.sh)}" onerror="this.style.opacity=.2">
   <div class="dps-info">
    <div class="dps-top"><b>${item.name}</b><span>${total} (${perSec}/s)</span></div>
    <div class="dps-bar-bg"><div class="dps-bar" style="width:${pct}%"></div></div>
   </div>
  </div>`;
 }).join('');
}

function restart(){if(!confirm('Match wirklich neu starten? Der aktuelle Fortschritt geht verloren.'))return;clearSave();newGame()}

function startBattle(){
 if(S.phase=='done'){newGame();return}
 if(S.phase!='prep')return;
 if(!placed().length)return;
 ensureSpecials();
 S.sel=null;S.speed=1;S.phase='battle';
 const playerUnits=buildPlayer(true);
 B.units=playerUnits.concat(buildEnemy());
 B.fx=[];B.proj=[];B.waves=[];B.barriers=[];B.txt=[];B.fields=[];B.flag={};B.end=0;B.time=0;
 /* DPS-Chart für die neue Runde zurücksetzen und mit den aufgestellten Pokémon befüllen */
 B.dps=playerUnits.map(u=>({uid:u.uid,name:u.name,spriteId:u.id,sh:u.sh,dmg:0}));
 B.dpsTimer=0;
 renderDpsChart();

 const cnt=typeCounts();
 if((cnt.Ghost||0)>=2&&S.decoyPos){
  const k=tierIdx('Ghost',cnt.Ghost);
  const dhp=DECOY_HP[k];
  const d=mk('p',S.decoyPos.r,S.decoyPos.c,'Delegator',0,false,{hp:dhp,atk:0,aspd:1,def:0,crit:0,range:0,mg:0,skill:1});
  d.decoy=true;
  B.units.push(d);
 }

 /* Boden-Bonus: Bei Rundenbeginn ans hintere Ende der Gegner schleichen */
 const occ=new Set(B.units.filter(u=>u.hp>0).map(u=>u.r+','+u.c));
 for(const u of B.units){
  if(u.team=='p'&&u.ground>0){
   occ.delete(u.r+','+u.c);
   let best=null;
   for(let r=0;r<4;r++){
    for(let c=0;c<COLS;c++){
     if(!occ.has(r+','+c)){best={r,c};break;}
    }
    if(best)break;
   }
   if(best){
    u.r=best.r;u.c=best.c;
    const[nx,ny]=px(u.r,u.c);
    u.x=nx;u.y=ny;

    say(u,'💨','#c9a24a');
   }
   occ.add(u.r+','+u.c);
  }
 }
 render();
}

const asp=u=>u.aspd*(1+u.spdBuff)*(1-(u.slowT>0?u.slow:0));
const effAtk=u=>u.atk*(1-(u.atkDownT>0?u.atkDown:0));
const say=(t,s,col)=>B.txt.push({x:t.x,y:t.y-32,s,t:.75,col});

function dealDmg(t, d, col, pre, attacker){
 if(!t||t.hp<=0)return 0;
 
 // --- NEU: Reflect-Schadensreduktion für Verbündete (75% weniger Schaden) ---
 if(t.team == 'p') {
  const inReflect = B.barriers.some(b => b.team == t.team && b.type == 'reflectZone' && b.r == t.r && b.c == t.c);
  if(inReflect) {
   d = d * 0.25; // Reduziert den Schaden auf 25% (erleidet also 75% weniger)
  }
 }
 const dealt=Math.max(1,Math.round(d));
 let rem=dealt;
 if(t.shield>0){const a=Math.min(t.shield,rem);t.shield-=a;rem-=a}
 t.hp-=rem;
 recordDamage(attacker,dealt);
 B.txt.push({x:t.x,y:t.y-30,s:(pre||'')+dealt,t:.7,col:col||'#fff'});
 if(attacker&&attacker.ls>0)heal(attacker,dealt*attacker.ls);
 if(t.hp<=0&&!t.rev&&(t.dragon||t.reviveTo)){
  t.rev=1;const rv=t.reviveTo;t.hp=t.max*(rv?rv.hp:t.dragon);
  if(rv)morph(t,rv);
  else{B.waves.push({x:t.x,y:t.y,r:6,maxR:55,col:'#6f35fc',t:.5,maxT:.5});say(t,'🐉 Revive','#a98ff3')}
 }else if(t.hp<=0&&!t.dead){
  t.dead=1;if(t.die)t.die(t,B.units.filter(x=>x.hp>0))
 }
 return dealt;
}

function morph(u,f){if(f.sprite!=null){u.fb=f.fb??u.id;u.id=f.sprite}if(f.name)u.name=f.name;if(f.atkX)u.atk*=f.atkX;if(f.big!=null)u.big=f.big;say(u,'✨')}

function doSplit(u){u.splitDone=1;const occ=new Set(B.units.filter(o=>o.hp>0&&o!==u).map(o=>o.r*100+o.c)),cells=[];
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)cells.push({r,c});cells.sort((a,b)=>dist(a,u)-dist(b,u));
 u.hp=0;u.dead=1;
 const splitCount = u.split.into.length; // NEU: Anzahl der Teile (bei Necrozma = 2)
 for(const k of u.split.into){const cell=cells.find(x=>!occ.has(x.r*100+x.c));if(!cell)break;occ.add(cell.r*100+cell.c);
  // NEU: atk wird durch splitCount geteilt, damit sich der Gesamtschaden nicht verdoppelt
  const n=mk('e',cell.r,cell.c,k.name,k.sprite,false,{hp:u.max*(k.hpX||1),atk:(u.atk*(k.atkX||1))/splitCount,aspd:u.aspd,def:u.def,crit:u.crit,range:u.range,mg:u.mg,mmax:u.mmax,skill:u.skill,big:k.big??true});
  n.hp=n.max*u.split.at;n.fb=k.fb??u.id;n.t=u.t;n.x=u.x;n.y=u.y;B.units.push(n);say(n,'✨')}}

const heal=(u,a)=>{if(u&&u.hp>0)u.hp=Math.min(u.max,u.hp+a)};

function checkBarrierMitigation(sx,sy,tx,ty,targetTeam){
 for(const b of B.barriers){
  if(b.team!==targetTeam)continue;
  // Wenn es eine Reflect-Zone ist (oder eine normale Barriere)
  if(b.r === Math.round((ty - OY) / RH) && b.c === Math.round((tx - OX) / W)) { // oder deine alte Distanzprüfung
   // Alternativ mit deiner Distanzprüfung zum Feld:
  }
  const[bx,by]=px(b.r,b.c);
  if(Math.hypot(bx-tx,by-ty)<W*1.15){
   B.waves.push({x:bx,y:by,r:4,maxR:26,col:'#ff66cc',t:.25,maxT:.25});
   return 0.5;
  }
 }
 return 1;
}

function segDist(px0,py0,x1,y1,x2,y2){
 const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;
 if(l2===0)return Math.hypot(px0-x1,py0-y1);
 let t=((px0-x1)*dx+(py0-y1)*dy)/l2;
 t=Math.max(0,Math.min(1,t));
 return Math.hypot(px0-(x1+t*dx),py0-(y1+t*dy));
}

/* ================= SPEZIAL-FÄHIGKEITEN DER SPIELER-POKÉMON ================= */
function castPlayerSkill(u,t,A){
 const foes=A.filter(f=>f.team!=u.team&&f.hp>0);
 const mult=u.dm*(1+fightBuff(u,A));
 const rawAb=u.abDmg*mult;

 switch(u.abName){
  case 'Close Combat':{
   /* Rote Animation: 10 + Ability DMG an allen umliegenden Gegnern im Umkreis von 2 Feldern */
   B.waves.push({x:u.x,y:u.y,r:12,maxR:W*2.2,col:'#ff3b3b',t:.45,maxT:.45,fill:true});
   for(const f of foes){
    if(dist(u,f)<=2){
     const d=(10+rawAb)*100/(100+f.def);
     dealDmg(f,d,'#ff4d4d','🥊',u);
    }
   }
   break;
  }
  case 'Snipe Shot':{
   const dx=t.x-u.x,dy=t.y-u.y,len=Math.hypot(dx,dy)||1;
   const ex=u.x+(dx/len)*850,ey=u.y+(dy/len)*850;
   B.fx.push({x1:u.x,y1:u.y,x2:ex,y2:ey,t:.38,maxT:.38,col:'#ffe63b',w:8,glow:'#ffae00'});
   for(const f of foes){
    if(segDist(f.x,f.y,u.x,u.y,ex,ey)<=W*0.58){
     const d=rawAb*100/(100+f.def);
     dealDmg(f,d,'#ffe63b','⚡',u);
    }
   }
   break;
  }
  case 'Reflect':{
   // Erstelle ein Objekt für die 3 Felder (Eigenes Feld + links + rechts in derselben Reihe r)
   const targetCols = [u.c - 1, u.c, u.c + 1].filter(c => c >= 0 && c < COLS);
   for (const c of targetCols) {
    // Wir nutzen das barriers-Array, speichern aber Dauer (5s) und Typ ab
    B.barriers.push({
     team: u.team, 
     r: u.r, 
     c: c, 
     t: 5, 
     maxT: 5, 
     type: 'reflectZone'
    });
    const [bx, by] = px(u.r, c);
    B.waves.push({x: bx, y: by, r: 6, maxR: 38, col: '#ff66cc', t: .4, maxT: .4, fill: true});
   }
   say(u, '🛡️ Reflect', '#ff66cc');
   break;
  }
  case 'Bulldoze':{
   let boss=foes[0];
   for(const f of foes)if(f.hp>boss.hp)boss=f;
   if(!boss)break;
   const occ=new Set(A.filter(o=>o!==u&&o.hp>0).map(o=>o.r+','+o.c));
   let bestCell=null,bestD=99;
   for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(occ.has(r+','+c))continue;
    const dd=dist({r,c},boss);
    if(dd>=1&&dd<bestD){bestD=dd;bestCell={r,c}}
   }
   const ox=u.x,oy=u.y;
   if(bestCell){u.r=bestCell.r;u.c=bestCell.c;const[nx,ny]=px(u.r,u.c);u.x=nx;u.y=ny}
   B.fx.push({x1:ox,y1:oy,x2:u.x,y2:u.y,t:.35,maxT:.35,col:'#c87d32',w:10,glow:'#8a4b14'});
   B.waves.push({x:boss.x,y:boss.y,r:8,maxR:W*1.1,col:'#c87d32',t:.4,maxT:.4,fill:true});
   const d=rawAb*100/(100+boss.def);
   dealDmg(boss,d,'#e09a48','🪨',u);
   break;
  }
  case 'Weather Ball':{
    let boss=foes[0];
    for(const f of foes)if(f.hp>boss.hp)boss=f;
    if(!boss)break;
    B.proj.push({
     x:u.x,y:u.y,sx:u.x,sy:u.y,tx:boss.x,ty:boss.y,target:boss,
     t:0,dur:.26,col:'#ffffff',glow:'#99e6ff',r:11,team:u.team,
     onHit:(bx,by)=>{
      // Große weiße Schockwelle für den Hauptschaden
      B.waves.push({x:bx,y:by,r:10,maxR:W*1.4,col:'#ffffff',t:.42,maxT:.42,fill:true});
      const live=B.units.filter(x=>x.team!=u.team&&x.hp>0);
      for(const f of live){
       if(f===boss||dist(f,boss)<=1){
        const d=rawAb*100/(100+f.def);
        dealDmg(f,d,'#ffffff','❄️',u);
        // NEU: Kurzes weißes Aufleuchten direkt auf den betroffenen Gegner-Feldern
        B.waves.push({x:f.x,y:f.y,r:4,maxR:W*0.8,col:'#ffffff',t:.25,maxT:.25,fill:true});
       }
      }
     }
    });
    break;
   }
  default:{
   B.proj.push({
    x:u.x,y:u.y,sx:u.x,sy:u.y,tx:t.x,ty:t.y,target:t,
    t:0,dur:.22,col:'#b86bff',glow:'#6b21a8',r:9,team:u.team,
    onHit:(bx,by)=>{
     B.waves.push({x:bx,y:by,r:6,maxR:44,col:'#b86bff',t:.35,maxT:.35,fill:true});
     const d=rawAb*100/(100+t.def);
     const dealt=dealDmg(t,d,'#d896ff','🔮',u);
     heal(u,dealt*0.8);
    }
   });
  }
 }
}

function fightBuff(u,A){
 let b=0;
 for(const a of A){
  if(a.fight&&a.team==u.team&&a.hp>0&&dist(a,u)<=1)b+=a.fight;
 }
 return b;
}

function applyOnHitEffects(u,t,d){
 if(u.ice){t.slow=Math.max(t.slow,u.ice);t.slowT=3}
 if(u.fire){
  t.atkDown=Math.max(t.atkDown,u.fire);t.atkDownT=4;
  if(!t.fireDotDone){t.fireDotDone=1;t.poisD=Math.max(t.poisD,effAtk(u)*0.12);t.poisOwner=u;t.poisT=Math.max(t.poisT,4)}
 }
 if(u.pois){t.poisD=Math.max(t.poisD,effAtk(u)*u.pois);t.poisOwner=u;t.poisT=5}
 if(u.psy&&u.atkN%7===0){
  const alliesOfTarget=B.units.filter(x=>x.team==t.team&&x!==t&&!x.decoy&&x.hp>0);
  if(alliesOfTarget.length>0){t.berserk=2.5;say(t,'😵 Berserker!','#f95587')}
  else{t.stun=2.5;say(t,'💫 Stun','#f95587')}
 }
}

function hit(u,t,A){
 u.cd=1/asp(u);
 u.mana+=u.mg;
 u.atkN++;

 const cast=(u.mana>=u.mmax);
 if(cast){
  u.mana=0;
  if(u.fairy){
   for(const a of A){
    if(a.team==u.team&&!a.decoy&&a.hp>0&&dist(a,u)<=1){
     heal(a,a.max*u.fairy);
     say(a,'💚','#d685ad');
    }
   }
  }
  if(u.team=='p'&&u.abName){
   u.lx=(t.x-u.x)*.22;u.ly=(t.y-u.y)*.22;
   castPlayerSkill(u,t,A);
   return;
  }
 }

 const flyExtra=(u.flyBonus&&u.team=='p')?dist(u,t)*u.flyBonus:0;
 let baseD=(effAtk(u)+flyExtra)*(cast?u.skill:1)*u.dm*(1+fightBuff(u,A));
 if(u.ground&&!u.groundDone){u.groundDone=1;baseD+=u.ground}
 const crit=Math.random()<u.crit;
 if(crit)baseD*=2;

 u.lx=(t.x-u.x)*.18;u.ly=(t.y-u.y)*.18;

 if(u.team=='e'){
  B.fx.push({x1:u.x,y1:u.y,x2:t.x,y2:t.y,t:.18,maxT:.18,col:'#ff3838',w:cast?5:2.5,glow:'#aa0000'});
  const d=Math.max(1,Math.round(baseD*100/(100+t.def)));
  dealDmg(t,d,cast?'#ff5555':crit?'#ff9944':'#ffcccc',cast?'💥':crit?'!':'',u);
  applyOnHitEffects(u,t,d);
  if(cast&&u.onCast)u.onCast(u,t,A);
 }else{
  const isRanged=u.range>=2;
  if(isRanged){
   B.proj.push({
    x:u.x,y:u.y,sx:u.x,sy:u.y,tx:t.x,ty:t.y,target:t,
    t:0,dur:.16,col:'#ffffff',glow:'#cfe8ff',r:5.5,team:u.team,
    onHit:(bx,by)=>{
     if(!t||t.hp<=0)return;
     const mit=checkBarrierMitigation(u.x,u.y,t.x,t.y,t.team);
     const d=Math.max(1,Math.round(baseD*mit*100/(100+t.def)));
     dealDmg(t,d,crit?'#ffe066':'#ffffff',crit?'!':'',u);
     applyOnHitEffects(u,t,d);
    }
   });
  }else{
   B.fx.push({x1:u.x,y1:u.y,x2:t.x,y2:t.y,t:.14,maxT:.14,col:'#ffffff',w:3,glow:'#cfe8ff'});
   B.waves.push({x:t.x,y:t.y,r:4,maxR:24,col:'#ffffff',t:.2,maxT:.2});
   const d=Math.max(1,Math.round(baseD*100/(100+t.def)));
   dealDmg(t,d,crit?'#ffe066':'#ffffff',crit?'!':'',u);
   applyOnHitEffects(u,t,d);
  }
 }
}

function stepToward(u,t,A){const occ=new Set();for(const o of A)if(o!==u&&o.hp>0)occ.add(o.r*100+o.c);
 const key=(r,c)=>r*COLS+c,prev=new Map([[key(u.r,u.c),null]]),q=[{r:u.r,c:u.c}];let goal=null,fb=null,fbd=dist(u,t);
 for(let i=0;i<q.length;i++){const n=q[i];
  if(i>0){const dd=dist(n,t);if(dd<=u.range){goal=n;break}if(dd<fbd){fbd=dd;fb=n}}
  for(const[dr,dc]of DIRS[n.r&1]){const r=n.r+dr,c=n.c+dc;
   if(r<0||r>=ROWS||c<0||c>=COLS||prev.has(key(r,c))||occ.has(r*100+c))continue;
   prev.set(key(r,c),n);q.push({r,c})}}
 let n=goal||fb;if(!n)return;
 while(true){const p=prev.get(key(n.r,n.c));if(p.r==u.r&&p.c==u.c)break;n=p}
 u.r=n.r;u.c=n.c}

function step(dt){
 B.time+=dt;
 B.dpsTimer=(B.dpsTimer||0)+dt;
 if(B.dpsTimer>=0.25){B.dpsTimer=0;renderDpsChart();}
 if(B.time>=CFG.speedUpAfter&&S.speed<CFG.speedUpTo)S.speed=CFG.speedUpTo;
 const A=B.units.filter(u=>u.hp>0);

 for(const u of A){
  if(u.stun>0)u.stun-=dt;
  if(u.berserk>0)u.berserk-=dt;
  if(u.slowT>0)u.slowT-=dt;
  if(u.atkDownT>0)u.atkDownT-=dt;
  if(u.poisT>0){
   u.poisT-=dt;u.pAcc+=dt;
   if(u.pAcc>=1){u.pAcc-=1;dealDmg(u,Math.round(u.poisD),'#44dd55','☠',u.poisOwner)}
  }
 }
 for(const u of A)if(u.split&&!u.splitDone&&u.hp>0&&u.hp<=u.max*u.split.at)doSplit(u);

for(const b of B.barriers){
  const[bx,by]=px(b.r,b.c);
  ctx.save();
  ctx.strokeStyle='#ff66cc';ctx.fillStyle='rgba(255,102,204,0.35)';ctx.lineWidth=3;
  ctx.shadowColor='#ff66cc';ctx.shadowBlur=10;
  hexPath(bx,by,R-2);ctx.fill();ctx.stroke();
  ctx.restore();
 }

 for(const u of A){
  if(u.hp<=0||u.decoy)continue;
  u.cd-=dt;u.mv-=dt;
  if(u.stun>0)continue;

  /* Zielwahl: Delegator zieht NICHT global die Aggro – es wird einfach das nächstgelegene Ziel angegriffen */
  let foes;
  if(u.berserk>0){
   foes=A.filter(f=>f.team==u.team&&f!==u&&!f.decoy&&f.hp>0);
   if(!foes.length)foes=A.filter(f=>f.team!=u.team&&f.hp>0);
  }else{
   foes=A.filter(f=>f.team!=u.team&&f.hp>0);
  }
  if(!foes.length)continue;

  let t=foes[0],d=1e9;
  for(const f of foes){const x=dist(u,f);if(x<d){d=x;t=f}}
  if(d<=u.range){if(u.cd<=0)hit(u,t,A)}
  else if(u.mv<=0){stepToward(u,t,A);u.mv=CFG.moveDelay}
 }

 for(const pr of B.proj){
  pr.t+=dt;
  const k=Math.min(1,pr.t/pr.dur);
  const tx=pr.target&&pr.target.hp>0?pr.target.x:pr.tx;
  const ty=pr.target&&pr.target.hp>0?pr.target.y:pr.ty;
  pr.x=pr.sx+(tx-pr.sx)*k;
  pr.y=pr.sy+(ty-pr.sy)*k;
  if(k>=1&&!pr.done){pr.done=1;if(pr.onHit)pr.onHit(pr.x,pr.y)}
 }
 B.proj=B.proj.filter(pr=>!pr.done);

 for(const w of B.waves){w.t-=dt;const k=1-Math.max(0,w.t/w.maxT);w.r=6+(w.maxR-6)*k}
 B.waves=B.waves.filter(w=>w.t>0);

 B.fx.forEach(f=>f.t-=dt);B.fx=B.fx.filter(f=>f.t>0);
 B.txt.forEach(f=>{f.t-=dt;f.y-=dt*25});B.txt=B.txt.filter(f=>f.t>0);

 const pl=B.units.some(u=>u.team=='p'&&!u.decoy&&u.hp>0),en=B.units.some(u=>u.team=='e'&&u.hp>0);
 if(B.time>120){finish(false);return}
 if(!pl||!en){B.end+=dt;if(B.end>1.2)finish(pl)}
}

function finish(win){if(S.phase!='battle')return;renderDpsChart();S.phase='prep';const last=S.round>=EN.length;
 if(win&&last){S.phase='done';clearSave();B.units=[];render();return}
 S.gold+=income();tryMerge();
 if(win)S.round++;
 else{S.lives--;if(S.lives<=0){S.phase='done';clearSave();render();return}}
 roll();save();render()}

/* ================= EINGABE (Klick + Drag & Drop) ================= */
function cellAt(cx,cy){const cv=$('cv'),b=cv.getBoundingClientRect(),mx=(cx-b.left)*cv.width/b.width,my=(cy-b.top)*cv.height/b.height;
 let hr=-1,hc=-1,bd=R;for(let r=4;r<ROWS;r++)for(let c=0;c<COLS;c++){const[x,y]=px(r,c),d=Math.hypot(x-mx,y-my);if(d<bd){bd=d;hr=r;hc=c}}
 return hr<0?null:{r:hr,c:hc}}
const occAt=c=>placed().find(u=>u.pos.r==c.r&&u.pos.c==c.c);

function moveTo(id,tgt){const o=unitById(id);if(!o)return;const bat=S.phase=='battle';
 if(tgt=='trash'){if(bat&&o.pos)return;sell(id);return}
 if(tgt=='bench'){if(!o.pos)return;tgt={slot:freeSlot()}}
 if(tgt.slot!==undefined){
  if(tgt.slot==null||(bat&&o.pos))return;
  const occ=S.units.find(u=>!u.pos&&u.slot===tgt.slot);
  if(occ===o)return;
  if(!occ){if(S.crownOn===o.id)S.crownOn=null;o.pos=null;o.slot=tgt.slot;return}
  if(o.pos){occ.pos=o.pos;occ.slot=null;o.pos=null;o.slot=tgt.slot;if(S.crownOn===o.id)S.crownOn=null}
  else{occ.slot=o.slot;o.slot=tgt.slot}
  return}
 if(bat)return;
 if(S.decoyPos&&S.decoyPos.r==tgt.r&&S.decoyPos.c==tgt.c){
  if(o.pos){S.decoyPos={r:o.pos.r,c:o.pos.c};o.pos={r:tgt.r,c:tgt.c};return}
  if(placed().length>=limit())return;
  const h=freeHex();if(!h)return;
  S.decoyPos=h;o.pos={r:tgt.r,c:tgt.c};o.slot=null;return
 }
 const occ=occAt(tgt);
 if(occ===o)return;
 if(occ){const op=o.pos,os=o.slot;occ.pos=op;occ.slot=op?null:os;o.pos={r:tgt.r,c:tgt.c};o.slot=null;if(!op&&S.crownOn===occ.id)S.crownOn=null;return}
 if(!o.pos&&placed().length>=limit())return;
 o.pos={r:tgt.r,c:tgt.c};o.slot=null}

function slotClick(k){if(!act()||S.sel==null)return;moveTo(S.sel,{slot:k});S.sel=null;render()}
function clickCell(c){if(!c){S.sel=null;render();return}
 const occ=occAt(c);
 if(S.sel!=null){if(occ&&occ.id==S.sel)S.sel=null;else{moveTo(S.sel,c);S.sel=null}}
 else if(occ)S.sel=occ.id;
 render()}

let D=null;
function bdown(e,id){if(!act())return;e.preventDefault();D={id,x:e.clientX,y:e.clientY,moved:false,from:'bench'}}

$('crownBox').addEventListener('pointerdown',e=>{
 if(S.phase!='prep')return;e.preventDefault();
 D={type:'crown',x:e.clientX,y:e.clientY,moved:false};
 const g=document.createElement('div');g.id='ghost';g.style.fontSize='36px';g.textContent='👑';document.body.appendChild(g);D.g=g;
});

$('cv').addEventListener('pointerdown',e=>{
 if(S.phase!='prep')return;e.preventDefault();
 const c=cellAt(e.clientX,e.clientY);
 if(c&&S.decoyPos&&S.decoyPos.r==c.r&&S.decoyPos.c==c.c&&(typeCounts().Ghost||0)>=2){
  D={type:'decoy',x:e.clientX,y:e.clientY,moved:false};
  const g=document.createElement('div');g.id='ghost';g.style.fontSize='34px';g.textContent='🎎';document.body.appendChild(g);D.g=g;
  return;
 }
 const o=c?occAt(c):null;
 D={id:o?o.id:null,x:e.clientX,y:e.clientY,moved:false,from:'cv'};
});

window.addEventListener('pointermove',e=>{if(!D)return;
 if(D.type==='crown'||D.type==='decoy'){
  D.moved=true;
  if(D.g){D.g.style.left=e.clientX-18+'px';D.g.style.top=e.clientY-18+'px'}
  return;
 }
 if(!D.moved&&D.id!=null&&Math.hypot(e.clientX-D.x,e.clientY-D.y)>6){D.moved=true;S.sel=null;
  const g=document.createElement('img');g.id='ghost';const u=unitById(D.id),sp=SP[u.sp];g.src=url(sp.id[u.star-1],sp.sh);document.body.appendChild(g);D.g=g}
 if(D.g){D.g.style.left=e.clientX-32+'px';D.g.style.top=e.clientY-32+'px';
  const el=document.elementFromPoint(e.clientX,e.clientY);$('trash').classList.toggle('over',!!(el&&el.closest('#trash')))}});

window.addEventListener('pointerup',e=>{if(!D)return;const d=D;D=null;if(d.g)d.g.remove();$('trash').classList.remove('over');
 if(d.type==='crown'){
  const el=document.elementFromPoint(e.clientX,e.clientY);
  if(el===$('cv')){const c=cellAt(e.clientX,e.clientY);const o=c?occAt(c):null;if(o)S.crownOn=o.id}
  render();return;
 }
 if(d.type==='decoy'){
  const el=document.elementFromPoint(e.clientX,e.clientY);
  if(el===$('cv')){const c=cellAt(e.clientX,e.clientY);if(c&&!occAt(c))S.decoyPos=c}
  render();return;
 }
 if(d.moved){const el=document.elementFromPoint(e.clientX,e.clientY);let tgt=null;
  if(el===$('cv'))tgt=cellAt(e.clientX,e.clientY);else if(el&&el.closest('#trash'))tgt='trash';else if(el&&el.closest('[data-slot]'))tgt={slot:+el.closest('[data-slot]').dataset.slot};else if(el&&el.closest('#bench'))tgt='bench';
  if(tgt)moveTo(d.id,tgt);render();return}
 if(d.from=='bench'){S.sel=(S.sel==d.id)?null:d.id;render()}
 else clickCell(cellAt(e.clientX,e.clientY))});
window.addEventListener('pointercancel',()=>{if(D&&D.g)D.g.remove();D=null;$('trash').classList.remove('over')});

/* ================= TOOLTIPS ================= */
function tip(t,e){const cnt=typeCounts()[t]||0,k=tierIdx(t,cnt),tb=TB[t];
 const onB=new Set(placed().map(u=>u.sp)),own=new Set(S.units.map(u=>u.sp));
 let h=`<div>${typeBadge(t)} <b>${cnt}</b> aufgestellt</div>`+
  tb.th.map((x,j)=>`<div class="${j==k?'ta':''}"><b>${x} Pokémon:</b> ${tb.d(tb.v[j],j)}</div>`).join('')+
  `<div class="tl">Pokémon mit diesem Typ:</div><div class="tp">`+
  SP.map((s,i)=>s.t.includes(t)?`<div class="pc ${onB.has(i)?'on':own.has(i)?'own':''}"><img src="${url(s.id[0],s.sh)}">${s.n[0]}</div>`:'').join('')+'</div>';
 const el=$('tip');el.innerHTML=h;el.style.display='block';tipMove(e)}

function tipPoke(spIdx,star,e){
 const s=SP[spIdx],cl=CLASSES[s.cls],sk=SKILLS[s.ab];
 const cMul=CFG.costMul[s.c]||1,sMul=CFG.hpMul[star-1]||1;
 const hp=Math.round(cl.hp*cMul*sMul),atk=Math.round(cl.atk*cMul*sMul),ab=Math.round(cl.abDmg*cMul*sMul);
 const h=`<div><b>${s.n[star-1]}</b> (${s.c}-Cost · ${cl.icon} ${s.cls})</div>
  <div style="margin:3px 0">${s.t.map(typeBadge).join(' ')}</div>
  <div style="color:#cde">HP: <b>${hp}</b> · ATK: <b>${atk}</b> · Ability DMG: <b>${ab}</b></div>
  <div style="color:#cde">DEF: <b>${cl.def}</b> · ASPD: <b>${cl.aspd}</b> · Crit: <b>${p(cl.crit)}</b> · Range: <b>${cl.range}</b></div>
  <div style="margin-top:5px;color:#fd6"><b>Fähigkeit – ${s.ab}:</b></div>
  <div style="color:#ddd">${sk?sk.desc:''}</div>`;
 const el=$('tip');el.innerHTML=h;el.style.display='block';tipMove(e);
}
function tipMove(e){const el=$('tip');el.style.left=Math.max(4,Math.min(e.clientX+16,innerWidth-el.offsetWidth-8))+'px';el.style.top=Math.max(4,Math.min(e.clientY+8,innerHeight-el.offsetHeight-8))+'px'}
function tipHide(){$('tip').style.display='none'}

/* ================= ANZEIGE ================= */
function slotInfo(){const T=CFG.slotAfter.find(t=>t>=S.round);
 if(limit()>=CFG.maxUnits||T==null)return`Alle ${CFG.maxUnits} Plätze freigeschaltet.`;
 const k=T-S.round+1;return`Nächster Platz (${limit()+1}.) nach Runde ${T} – noch ${k} Runde${k==1?'':'n'} (inkl. dieser).`}

function render(){if(!S)return;tipHide();ensureSpecials();const pl=placed().length;
 $('tr').innerHTML=`Runde <b>${S.round}/${EN.length}</b>`;
 $('tl').innerHTML=`❤️ <b>${S.lives}</b>`;
 $('tn').innerHTML=S.phase=='done'?(S.lives<=0?'💀 <b>Game Over</b>':'🏆 <b>Gewonnen!</b>'):`Nächster Gegner: <b>${EN[Math.min(S.round,EN.length)-1].map(e=>e.name).join(', ')}</b>`;
 $('gold').innerHTML=`💰 <b>${S.gold}</b> (+${income()} nächste Runde)`;
 $('plc').innerHTML=`Verfügbar: <b>${pl}/${limit()}</b>`;$('plc').title=slotInfo();$('plc').style.color=(S.phase=='prep'&&pl<limit())?'#ff5555':'';
 $('bBattle').disabled=S.phase=='battle';$('bBattle').textContent=S.phase=='done'?'🔄 Neues Spiel':'⚔️ Kampf!';$('bRoll').disabled=!act()||S.gold<CFG.reroll;

 const cnt=typeCounts();
 $('crownBox').classList.toggle('hidden',!(S.phase=='prep'&&(cnt.Bug||0)>=1));

 $('shop').innerHTML=S.shop.map((i,k)=>{if(i==null)return`<div class="card sold">–</div>`;const s=SP[i],cl=CLASSES[s.cls];
  return`<div class="card c${s.c}" onclick="buy(${k})" onmouseenter="tipPoke(${i},1,event)" onmousemove="tipMove(event)" onmouseleave="tipHide()">
   <img class="sp" src="${url(s.id[0],s.sh)}" onerror="this.style.opacity=.2">
   <b>${s.n[0]}</b>
   <span class="cl">${cl.icon} ${s.cls}</span>
   <div class="tys">${s.t.map(typeIcon).join('')}</div>
   <span class="co">${s.c} 💰</span></div>`}).join('');

 fixSlots();const bn=S.units.filter(u=>!u.pos);let bh='';
 for(let k=0;k<CFG.benchMax;k++){const u=bn.find(x=>x.slot===k);
  if(!u){bh+=`<div class="card empty" data-slot="${k}" onclick="slotClick(${k})"></div>`;continue}
  const s=SP[u.sp];
  bh+=`<div class="card c${s.c} ${S.sel==u.id?'sel':''}" data-slot="${k}" onmouseenter="tipPoke(${u.sp},${u.star},event)" onmousemove="tipMove(event)" onmouseleave="tipHide()" onpointerdown="bdown(event,${u.id})">
   <img class="sp" src="${url(s.id[u.star-1],s.sh)}" onerror="this.style.opacity=.2" draggable="false">
   <div class="tys">${s.t.map(typeIcon).join('')}</div>${starsHtml(u.star)}</div>`}
 $('bench').innerHTML=bh;

 $('buffs').innerHTML=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).map(t=>{const tb=TB[t],c=cnt[t],k=tierIdx(t,c);
  return`<div class="bf ${k>=0?'on':''}" onmouseenter="tip('${t}',event)" onmousemove="tipMove(event)" onmouseleave="tipHide()">${typeBadge(t)} <b>${c}</b><span class="th" style="float:right">${tb.th.map((x,j)=>`<i class="${c>=x?'r':''} ${j==k?'a':''}">${x}</i>`).join('')}</span><div class="bd">${k>=0?tb.d(tb.v[k],k):'Noch nicht aktiv'}</div></div>`}).join('')||'<small>Stelle Pokémon auf, um Boni zu sehen.</small>';
 refreshView()}

/* ================= ZEICHNEN ================= */
const ctx=$('cv').getContext('2d');ctx.imageSmoothingEnabled=false;
function hexPath(x,y,r){ctx.beginPath();for(let k=0;k<6;k++){const a=Math.PI/180*(60*k-30);ctx[k?'lineTo':'moveTo'](x+r*Math.cos(a),y+r*Math.sin(a))}ctx.closePath()}

function draw(t){ctx.clearRect(0,0,720,500);
 const su=S&&S.sel!=null?unitById(S.sel):null,selPos=su?su.pos:null;
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const[x,y]=px(r,c);hexPath(x,y,R-1.5);
  ctx.fillStyle=r<4?'#2a2233':'#22302f';ctx.fill();const sl=selPos&&selPos.r==r&&selPos.c==c;ctx.strokeStyle=sl?'#ff0':'#3d4660';ctx.lineWidth=sl?3:1;ctx.stroke()}
 if(!S||!B.units)return;

 for(const f of B.fields){const[x,y]=px(f.r,f.c);ctx.fillStyle='rgba(200,130,50,.25)';ctx.beginPath();ctx.arc(x,y,f.rad*W*.9,0,7);ctx.fill()}

 for(const b of B.barriers){
  const[bx,by]=px(b.r,b.c);
  ctx.save();
  ctx.strokeStyle='#ff66cc';ctx.fillStyle='rgba(255,102,204,0.28)';ctx.lineWidth=3;
  ctx.shadowColor='#ff66cc';ctx.shadowBlur=10;
  hexPath(bx,by,R-4);ctx.fill();ctx.stroke();
  ctx.restore();
 }

 const us=[...B.units].filter(u=>u.hp>0).sort((a,b)=>a.y-b.y);
 for(const u of us){const[tx,ty]=px(u.r,u.c);u.x+=(tx-u.x)*.18;u.y+=(ty-u.y)*.18;u.lx*=.85;u.ly*=.85;
  const bob=Math.sin(t/220+u.r*3+u.c)*2,x=u.x+u.lx,y=u.y+u.ly-8+bob,sz=u.big?96:80;
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(u.x,u.y+22,22,8,0,0,7);ctx.fill();
  if(u.decoy){
   ctx.fillStyle='#e8d36a';ctx.beginPath();ctx.arc(x,y,20,0,7);ctx.fill();
   ctx.strokeStyle='#a88b28';ctx.lineWidth=2;ctx.stroke();
   ctx.fillStyle='#000';ctx.beginPath();ctx.arc(x-7,y-3,3,0,7);ctx.arc(x+7,y-3,3,0,7);ctx.fill();ctx.fillRect(x-6,y+7,12,2);
  }else{
   let im=imgOf(u.id,u.sh);if(im.bad&&u.fb!=null)im=imgOf(u.fb,u.sh);
   if(im.complete&&im.naturalWidth&&!im.bad)ctx.drawImage(im,x-sz/2,y-sz/2,sz,sz);
   else{ctx.fillStyle=u.team=='p'?'#4a8':'#a54';ctx.beginPath();ctx.arc(x,y,24,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText(u.name.slice(0,7),x,y+4)}
  }
  const bw=50,by=u.y-46;ctx.fillStyle='#000';ctx.fillRect(u.x-bw/2,by,bw,6);
  ctx.fillStyle=u.team=='p'?'#4d4':'#d44';ctx.fillRect(u.x-bw/2,by,bw*Math.max(0,u.hp/u.max),6);
  if(u.shield>0){ctx.fillStyle='#9df';ctx.fillRect(u.x-bw/2,by-3,bw*Math.min(1,u.shield/u.max),3)}
  if(!u.decoy){ctx.fillStyle='#38f';ctx.fillRect(u.x-bw/2,by+7,bw*Math.min(1,u.mana/u.mmax),3)}
  if(u.star){ctx.fillStyle=STAR_COL[u.star-1];ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.font='bold 12px sans-serif';ctx.textAlign='center';
   const s='★'.repeat(u.star);ctx.strokeText(s,u.x,by-6);ctx.fillText(s,u.x,by-6)}
  if(u.crowned){ctx.font='16px sans-serif';ctx.textAlign='center';ctx.fillText('👑',u.x,by-20)}
  if(u.berserk>0){ctx.font='15px sans-serif';ctx.textAlign='center';ctx.fillText('💢',u.x+24,by-10)}
  else if(u.stun>0){ctx.font='16px sans-serif';ctx.textAlign='center';ctx.fillText('💫',u.x,by-20)}
  if(u.poisT>0){ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('☠',u.x+28,by+6)}
 }

 for(const w of B.waves){
  const a=Math.max(0,w.t/w.maxT);
  ctx.save();
  ctx.globalAlpha=a*0.75;
  ctx.strokeStyle=w.col;ctx.lineWidth=4;
  ctx.beginPath();ctx.arc(w.x,w.y,w.r,0,Math.PI*2);ctx.stroke();
  if(w.fill){ctx.globalAlpha=a*0.28;ctx.fillStyle=w.col;ctx.fill()}
  ctx.restore();
 }

 for(const f of B.fx){
  const a=Math.min(1,(f.t/(f.maxT||0.15))*1.4);
  ctx.save();
  ctx.globalAlpha=a;
  if(f.glow){ctx.shadowColor=f.glow;ctx.shadowBlur=12}
  ctx.strokeStyle=f.col;ctx.lineWidth=f.w;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(f.x1,f.y1);ctx.lineTo(f.x2,f.y2);ctx.stroke();
  ctx.restore();
 }

 for(const pr of B.proj){
  ctx.save();
  if(pr.glow){ctx.shadowColor=pr.glow;ctx.shadowBlur=12}
  ctx.fillStyle=pr.col;
  ctx.beginPath();ctx.arc(pr.x,pr.y,pr.r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.restore();
 }

 if(S.phase=='battle'&&S.speed>1){ctx.font='bold 16px sans-serif';ctx.textAlign='right';ctx.fillStyle='#fc6';ctx.fillText('⏩ x'+S.speed,712,22)}
 ctx.font='bold 14px sans-serif';ctx.textAlign='center';
 for(const f of B.txt){ctx.fillStyle=f.col;ctx.fillText(f.s,f.x,f.y)}}

let last=0;
function frame(t){const dt=Math.min((t-last)/1000,.05);last=t;
 if(S&&S.phase=='battle')for(let i=0;i<S.speed;i++){if(S.phase!='battle')break;step(dt*CFG.tempo)}
 draw(t);requestAnimationFrame(frame)}

if(!load())newGame();else render();
requestAnimationFrame(frame);
</script></body></html>
